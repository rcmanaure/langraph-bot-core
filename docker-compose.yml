  api:
    build: .
    entrypoint: ["/app/entrypoint.sh"]
    env_file: .env
    environment:
      # Testing only -- real env vars here override .env for THIS container
      # (pydantic-settings prefers real env over the .env file). All cache
      # layers off while actively debugging vision.py behavior live. Revert
      # to true (or remove this block) once done.
      - VISION_CACHE_ENABLED=false
      - EMBEDDING_CACHE_ENABLED=false
      - RETRIEVE_CACHE_ENABLED=false
    ports:
      - "8000:8000"
 #   depends_on:
 #     postgres:
 #       condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - lgbot-net
      - postgresql-net
    labels:
      - traefik.enable=true
      - traefik.http.routers.lgbot.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.lgbot.entrypoints=websecure
      - traefik.http.routers.lgbot.tls=true
      - traefik.http.routers.lgbot.tls.certresolver=letsencrypt
      - traefik.http.routers.lgbot.service=lgbot
      - traefik.http.services.lgbot.loadbalancer.server.port=8000
      # Upload/admin router with longer timeout (indexing can take 60+s)
      - traefik.http.routers.lgbot_upload.rule=Host(`${TRAEFIK_HOST}`) && (PathPrefix(`/upload`) || PathPrefix(`/admin/`))
      - traefik.http.routers.lgbot_upload.entrypoints=websecure
      - traefik.http.routers.lgbot_upload.tls=true
      - traefik.http.routers.lgbot_upload.tls.certresolver=letsencrypt
      - traefik.http.routers.lgbot_upload.service=lgbot_upload
      - traefik.http.services.lgbot_upload.loadbalancer.server.port=8000

  phoenix:
    # Pinned version, not :latest -- see docker-compose.dev.yml for why
    # (this repo already pins Postgres in dev specifically to avoid
    # dev/prod drift; Phoenix follows the same convention).
    image: arizephoenix/phoenix:13.15.0
    ports:
      # Loopback-only, never a bare "6006:6006" (binds 0.0.0.0 = public
      # internet by default). No VPN/private network exists in this repo
      # (verified -- only Traefik + external docker networks). Reach the UI
      # via an SSH tunnel to the host: ssh -L 6006:localhost:6006 <host>.
      - "127.0.0.1:6006:6006"  # UI/API
      - "127.0.0.1:4317:4317"  # OTLP gRPC
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
      - PHOENIX_ENABLE_AUTH=true
      - PHOENIX_SECRET=${PHOENIX_SECRET}
      - PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD=${PHOENIX_ADMIN_PASSWORD}
    volumes:
      - phoenix_data:/mnt/data
    restart: unless-stopped
    networks:
      - lgbot-net

#volumes:
#  pgdata:
volumes:
  phoenix_data:

networks:
  lgbot-net:
    external: true
  postgresql-net:
    name: postgresql-hr9b_default
    external: true
