services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_USER: ${DB_USER:-ragbot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ragbot}
      POSTGRES_DB: ${DB_NAME:-ragbot}
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=128MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ragbot}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - lgbot-dev

  api:
    build: .
    env_file: .env
    # Migrations must run before uvicorn starts (see entrypoint.sh, which
    # prod uses) -- a bare uvicorn command here skips them, so a fresh dev
    # DB crashes on boot with UndefinedTableError. Found live: cold dev
    # stack failed on _cleanup_stuck_jobs() querying index_jobs pre-migration.
    command: ["sh", "-c", "alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    # Default (10s) is shorter than a real turn can take (up to
    # _GRAPH_TIMEOUT_SECONDS=45s in app/channels/turn.py) -- Docker SIGKILLs
    # the whole container once this expires regardless of what the app's own
    # shutdown handler is doing, so wait_for_pending_turns() needs real room
    # to actually wait. Found live: a restart mid-turn silently dropped a
    # real WhatsApp reply with zero trace before this existed.
    stop_grace_period: 60s
    # environment:
    #   - ENVIRONMENT=development
    #   - DEBUG=true
    #   - LOG_LEVEL=info
    #   - DATABASE_URL=postgresql://${DB_USER:-ragbot}:${DB_PASSWORD:-ragbot}@postgres:5432/${DB_NAME:-ragbot}
    #   # Testing only -- real env vars here override .env for THIS container
    #   # only (pydantic-settings prefers real env over the .env file), so
    #   # local pytest runs (which read .env directly, no override) stay on
    #   # defaults. Putting these in .env instead broke 3 vision cache tests
    #   # that assume caching is on by default -- found live. Revert to true
    #   # (or remove) once done actively testing.
    #   - VISION_CACHE_ENABLED=false
    #   - EMBEDDING_CACHE_ENABLED=false
    #   - RETRIEVE_CACHE_ENABLED=false
    #   # Phoenix tracing on for this QA session -- endpoint must be the
    #   # compose service name (phoenix:4317), "localhost" from inside this
    #   # container is itself, not the phoenix container.
    #   - OBSERVABILITY_ENABLED=true
    #   - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:4317
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # Named volume so the container's own (Linux) venv, built during image
      # build, isn't shadowed by the bind mount above pulling in the host's
      # .venv (Windows binaries under WSL/Docker Desktop won't run in the
      # Linux container — this is what "No module named uvicorn" means).
      - api-venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - lgbot-dev

  phoenix:
    # Pinned version, not :latest -- matches this file's existing Postgres
    # pinning convention (pgvector/pgvector:0.8.2-pg16 above), specifically
    # to avoid debugging against a dev container that doesn't match prod.
    image: arizephoenix/phoenix:13.15.0
    ports:
      # 127.0.0.1 (not 0.0.0.0) even in dev -- on a developer's own
      # machine this is already equivalent to localhost:6006, so it costs
      # nothing, and it keeps the same habit as prod (docker-compose.yml)
      # so nobody copy-pastes a bare "6006:6006" from here into prod.
      - "127.0.0.1:6006:6006"
      - "127.0.0.1:4317:4317"
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    volumes:
      - phoenix_dev_data:/mnt/data
    networks:
      - lgbot-dev

  cloudflared-api:
    # Quick Tunnel -- zero config, no Cloudflare account/domain needed.
    # Prints a random https://*.trycloudflare.com URL to its own logs on
    # startup (`docker compose logs cloudflared-api`). Dev/local testing
    # only -- ephemeral URL, not for anything that needs a stable address.
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://api:8000
    depends_on:
      - api
    networks:
      - lgbot-dev
    restart: unless-stopped

  cloudflared-phoenix:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://phoenix:6006
    depends_on:
      - phoenix
    networks:
      - lgbot-dev
    restart: unless-stopped

volumes:
  pgdata:
  api-venv:
  phoenix_dev_data:

networks:
  lgbot-dev:
    driver: bridge
