<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>langraph-bot — Admin</title>
<style>
/* ── Linear design-system tokens ─────────────────────────────────── */
:root {
  --bg:           #08090a;
  --surface:      #191a1b;
  --surface-warm: var(--surface);
  --fg:   #f7f8f8;
  --fg-2: #d0d6e0;
  --muted: #8a8f98;
  --meta:  #62666d;
  --border:      rgba(255, 255, 255, 0.08);
  --border-soft: rgba(255, 255, 255, 0.05);
  --accent:        #5e6ad2;
  --accent-on:     #ffffff;
  --accent-hover:  #828fff;
  --accent-active: #4752c4;
  --success: #27a644;
  --warn:    #eab308;
  --danger:  #dc2626;
  --font-display: "Inter Variable", "Inter", "SF Pro Display", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-body:    "Inter Variable", "Inter", "SF Pro Display", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-mono:    "Berkeley Mono", ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
  --text-xs:   12px;
  --text-sm:   14px;
  --text-base: 16px;
  --text-lg:   18px;
  --text-xl:   24px;
  --text-2xl:  32px;
  --text-3xl:  48px;
  --text-4xl:  72px;
  --leading-body:     1.5;
  --leading-tight:    1.00;
  --tracking-display: -0.022em;
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-12: 48px;
  --section-y-desktop: 80px;
  --section-y-tablet:  48px;
  --section-y-phone:   32px;
  --radius-sm:   6px;
  --radius-md:   8px;
  --radius-lg:   12px;
  --radius-pill: 9999px;
  --elev-flat:   none;
  --elev-ring:   0 0 0 1px var(--border);
  --elev-raised: rgba(0, 0, 0, 0.4) 0px 2px 4px, 0 0 0 1px rgba(255, 255, 255, 0.05);
  --focus-ring: 0 0 0 2px color-mix(in oklab, var(--accent), transparent 30%), 0 4px 12px rgba(0, 0, 0, 0.1);
  --motion-fast:   150ms;
  --motion-base:   200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --container-max:            1200px;
  --container-gutter-desktop: 24px;
  --container-gutter-tablet:  16px;
  --container-gutter-phone:   12px;
}

/* ── Reset ────────────────────────────────────────────────────────── */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg-2);
  font-family: var(--font-body);
  font-feature-settings: "cv01", "ss03";
  font-size: var(--text-base);
  line-height: var(--leading-body);
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: var(--text-sm); color: var(--fg); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm);
}
svg.icon { width: 16px; height: 16px; flex: none; }
.icon-lg { width: 20px; height: 20px; }
code, .mono { font-family: var(--font-mono); }
.hidden { display: none !important; }
::selection { background: color-mix(in oklab, var(--accent), transparent 60%); }

/* ── Login screen ─────────────────────────────────────────────────── */
.login-screen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(600px 400px at 50% 20%, rgba(94,106,210,0.10), transparent 70%),
    var(--bg);
  padding: var(--space-6);
}
.login-card {
  width: 100%; max-width: 360px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: var(--space-8) var(--space-6); box-shadow: var(--elev-raised);
}
.login-mark {
  width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--accent);
  display: flex; align-items: center; justify-content: center; color: #fff; margin-bottom: var(--space-5);
}
.login-card h1 {
  font-size: var(--text-xl); font-weight: 510; color: var(--fg); letter-spacing: -0.288px; margin-bottom: var(--space-1);
}
.login-card p.sub { font-size: var(--text-sm); color: var(--muted); margin-bottom: var(--space-6); }
.login-field label {
  display: block; font-size: var(--text-xs); font-weight: 590; color: var(--fg-2); margin-bottom: var(--space-2);
  text-transform: uppercase; letter-spacing: 0.04em;
}
.login-field input {
  width: 100%; background: rgba(255,255,255,0.02); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 12px; color: var(--fg);
}
.login-field input::placeholder { color: var(--meta); }
.login-error, .inline-error {
  display: none; align-items: center; gap: var(--space-2); background: color-mix(in oklab, var(--danger), transparent 85%);
  border: 1px solid color-mix(in oklab, var(--danger), transparent 60%); color: #ff8a8a;
  border-radius: var(--radius-sm); padding: 8px 10px; font-size: var(--text-xs); margin-top: var(--space-3);
}
.login-error.show, .inline-error.show { display: flex; }
.login-submit { width: 100%; margin-top: var(--space-5); }

/* ── Buttons ──────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border-radius: var(--radius-sm); border: 1px solid transparent; font-size: var(--text-sm);
  font-weight: 510; padding: 8px 14px; transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
  white-space: nowrap;
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-ghost { background: rgba(255,255,255,0.02); color: #e2e4e7; border-color: rgb(36,40,44); }
.btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.05); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover:not(:disabled) { background: #ef4444; }
.btn-danger-outline { background: rgba(220,38,38,0.06); color: #ff9d9d; border-color: rgba(220,38,38,0.35); }
.btn-danger-outline:hover:not(:disabled) { background: rgba(220,38,38,0.14); }
.btn-sm { padding: 5px 10px; font-size: var(--text-xs); }
.btn-icon { padding: 6px; border-radius: var(--radius-sm); background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--fg-2); }
.btn-icon:hover:not(:disabled) { background: rgba(255,255,255,0.07); color: var(--fg); }
.btn-block { width: 100%; }

/* ── App shell ────────────────────────────────────────────────────── */
.app-shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
.sidebar {
  background: var(--surface); border-right: 1px solid var(--border-soft);
  display: flex; flex-direction: column; padding: var(--space-4) var(--space-3);
  position: sticky; top: 0; height: 100vh;
}
.sidebar-brand { display: flex; align-items: center; gap: 10px; padding: var(--space-2) var(--space-2) var(--space-6); }
.brand-mark {
  width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 590; font-size: 13px; flex: none;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-text strong { font-size: var(--text-sm); color: var(--fg); font-weight: 590; letter-spacing: -0.1px; }
.brand-text span { font-size: 11px; color: var(--meta); font-family: var(--font-mono); }
.sidebar-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm);
  background: transparent; border: 1px solid transparent; color: var(--muted); font-size: var(--text-sm);
  font-weight: 510; text-align: left; width: 100%;
}
.nav-item:hover { background: rgba(255,255,255,0.04); color: var(--fg-2); }
.nav-item.active { background: rgba(94,106,210,0.14); color: var(--fg); border-color: rgba(94,106,210,0.25); }
.nav-item svg { flex: none; }
.sidebar-footer { display: flex; flex-direction: column; gap: var(--space-2); padding-top: var(--space-4); border-top: 1px solid var(--border-soft); margin-top: var(--space-3); }
.env-tag {
  font-family: var(--font-mono); font-size: 10px; color: var(--success); background: rgba(39,166,68,0.12);
  border: 1px solid rgba(39,166,68,0.3); border-radius: var(--radius-sm); padding: 4px 8px; text-align: center; letter-spacing: 0.04em;
}

.main { padding: var(--space-6) var(--space-8); max-width: 1320px; }
.view-header { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-5); flex-wrap: wrap; }
.view-header h2 { font-size: var(--text-2xl); font-weight: 510; color: var(--fg); letter-spacing: -0.704px; }
.view-header p { font-size: var(--text-sm); color: var(--muted); margin-top: 4px; }
.toolbar { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }

/* ── Badges ───────────────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: var(--radius-pill);
  font-size: 12px; font-weight: 510; border: 1px solid transparent; white-space: nowrap;
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.badge-plan-free { background: rgba(255,255,255,0.04); color: var(--muted); border-color: var(--border); }
.badge-plan-basic { background: rgba(130,143,255,0.10); color: #a7b0ff; border-color: rgba(130,143,255,0.3); }
.badge-plan-pro { background: rgba(94,106,210,0.18); color: #c2c9ff; border-color: rgba(94,106,210,0.45); }
.badge-status-active { background: rgba(39,166,68,0.10); color: #4fd977; border-color: rgba(39,166,68,0.3); }
.badge-status-inactive { background: rgba(255,255,255,0.03); color: var(--meta); border-color: var(--border); }
.badge-wh-registered { background: rgba(39,166,68,0.10); color: #4fd977; border-color: rgba(39,166,68,0.3); }
.badge-wh-mismatch { background: rgba(234,179,8,0.10); color: #f4cc4b; border-color: rgba(234,179,8,0.35); }
.badge-wh-unknown { background: rgba(255,255,255,0.03); color: var(--meta); border-color: var(--border); }
.badge-wh-error { background: rgba(220,38,38,0.12); color: #ff8a8a; border-color: rgba(220,38,38,0.35); }
.badge-job-pending { background: rgba(255,255,255,0.03); color: var(--meta); border-color: var(--border); }
.badge-job-running { background: rgba(94,106,210,0.14); color: #a7b0ff; border-color: rgba(94,106,210,0.35); }
.badge-job-running .dot { animation: pulse 1.1s ease-in-out infinite; }
.badge-job-done { background: rgba(39,166,68,0.10); color: #4fd977; border-color: rgba(39,166,68,0.3); }
.badge-job-failed { background: rgba(220,38,38,0.12); color: #ff8a8a; border-color: rgba(220,38,38,0.35); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes spin { to { transform: rotate(360deg); } }
.spinning { animation: spin 0.8s linear infinite; }

/* ── Overview ─────────────────────────────────────────────────────── */
.stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: var(--space-4); margin-bottom: var(--space-8); }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-5); display: flex; flex-direction: column; gap: 10px; text-align: left; width: 100%; font-family: inherit; color: inherit; }
.stat-card.clickable { cursor: pointer; transition: border-color var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard); }
.stat-card.clickable:hover { border-color: rgba(94,106,210,0.4); background: rgba(94,106,210,0.05); }
.stat-top { display: flex; align-items: center; justify-content: space-between; }
.stat-label { font-size: 11px; font-weight: 590; text-transform: uppercase; letter-spacing: 0.05em; color: var(--meta); }
.stat-icon { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex: none; }
.stat-value { font-size: var(--text-2xl); font-weight: 560; color: var(--fg); letter-spacing: -0.02em; }
.stat-sub { font-size: 12px; color: var(--muted); }
.stat-link { font-size: 11px; color: var(--accent-hover); }
.quick-actions { display: flex; gap: var(--space-4); margin-bottom: var(--space-8); flex-wrap: wrap; }
.quick-action { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-4); flex: 1; min-width: 220px; text-align: left; color: var(--fg-2); font-family: inherit; }
.quick-action:hover { border-color: rgba(94,106,210,0.4); background: rgba(94,106,210,0.05); }
.qa-icon { width: 32px; height: 32px; border-radius: 8px; background: rgba(94,106,210,0.14); color: var(--accent-hover); display: flex; align-items: center; justify-content: center; flex: none; }
.quick-action strong { display: block; font-size: 13px; color: var(--fg); font-weight: 590; }
.quick-action span { font-size: 12px; color: var(--muted); }
.section-title { font-size: 12px; font-weight: 590; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg-2); margin-bottom: var(--space-3); }

/* ── Search + filters ─────────────────────────────────────────────── */
.search-box { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 10px; min-width: 220px; }
.search-box svg { color: var(--meta); flex: none; }
.search-box input { background: transparent; border: none; outline: none; color: var(--fg); font-size: var(--text-sm); width: 100%; }
.search-box input::placeholder { color: var(--meta); }
.filter-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--radius-pill); border: 1px solid var(--border); background: rgba(255,255,255,0.02); color: var(--muted); font-size: 12px; font-weight: 510; }
.filter-chip:hover { color: var(--fg-2); }
.filter-chip.active { background: rgba(94,106,210,0.16); color: var(--fg); border-color: rgba(94,106,210,0.4); }
.filter-chip .count { font-family: var(--font-mono); font-size: 11px; opacity: 0.7; }
select.field-select { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 10px; color: var(--fg); font-size: var(--text-sm); }
.nav-count { margin-left: auto; background: rgba(234,179,8,0.16); color: #f4cc4b; font-size: 11px; font-weight: 590; font-family: var(--font-mono); border-radius: var(--radius-pill); padding: 1px 7px; }

/* ── Operator (embedded) ─────────────────────────────────────────────── */
.main.no-pad { padding: 0; max-width: none; height: 100vh; overflow: hidden; }
.op-shell { height: 100%; display: grid; grid-template-columns: 340px 1fr; }
.op-list-pane { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
.op-list-header { padding: var(--space-4); border-bottom: 1px solid var(--border); }
.op-list-header h1 { font-size: var(--text-lg); color: var(--fg); font-weight: 590; margin-bottom: 10px; }
.op-chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.op-thread-list { overflow-y: auto; flex: 1; }
.op-thread-row { display: block; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--border-soft); padding: 12px var(--space-4); color: var(--fg-2); font-family: inherit; }
.op-thread-row:hover { background: rgba(255,255,255,0.03); }
.op-thread-row.active { background: rgba(94,106,210,0.08); border-left: 2px solid var(--accent); padding-left: calc(var(--space-4) - 2px); }
.op-row-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 12px; color: var(--muted); }
.op-row-id { display: flex; align-items: center; gap: 7px; }
.op-channel-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.op-channel-dot.whatsapp { background: var(--success); }
.op-channel-dot.telegram { background: #5e9bd2; }
.op-row-preview { font-size: var(--text-sm); color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.op-row-meta { margin-top: 7px; display: flex; gap: 6px; flex-wrap: wrap; }
.op-tag { font-size: 11px; padding: 2px 8px; border-radius: var(--radius-pill); border: 1px solid var(--border); color: var(--muted); }
.op-tag.urgent { color: #ff8a8a; border-color: rgba(220,38,38,0.35); background: rgba(220,38,38,0.08); }
.op-tag.attending { color: #f4cc4b; border-color: rgba(234,179,8,0.35); background: rgba(234,179,8,0.08); }
.op-detail-pane { display: flex; flex-direction: column; min-height: 0; }
.op-detail-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--meta); font-size: var(--text-sm); }
.op-detail-header { padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); }
.op-detail-header .title { font-size: var(--text-base); color: var(--fg); font-weight: 590; }
.op-detail-header .sub { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
.op-messages { flex: 1; overflow-y: auto; padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); }
.op-msg-row { display: flex; flex-direction: column; max-width: 68%; }
.op-msg-row.self { align-self: flex-end; align-items: flex-end; }
.op-msg-row.other { align-self: flex-start; align-items: flex-start; }
.op-msg-meta { font-size: 11px; color: var(--meta); margin-bottom: 3px; display: flex; gap: 6px; align-items: center; }
.op-sender-chip { font-size: 10px; font-weight: 590; text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 6px; border-radius: 4px; }
.op-sender-chip.user { background: rgba(255,255,255,0.06); color: var(--muted); }
.op-sender-chip.bot { background: rgba(94,106,210,0.14); color: #a7b0ff; }
.op-sender-chip.operator { background: rgba(39,166,68,0.14); color: #4fd977; }
.op-msg-bubble { padding: 9px 13px; border-radius: var(--radius-md); font-size: var(--text-sm); line-height: 1.45; }
.op-msg-row.other .op-msg-bubble { background: var(--surface); color: var(--fg-2); }
.op-msg-row.self .op-msg-bubble { background: var(--accent); color: #fff; }
.op-reply-area { border-top: 1px solid var(--border); padding: var(--space-4) var(--space-5); background: var(--surface); }
.op-canned-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.op-canned-chip { font-size: 11px; padding: 5px 10px; border-radius: var(--radius-pill); border: 1px solid var(--border); background: rgba(255,255,255,0.02); color: var(--muted); font-family: inherit; }
.op-canned-chip:hover { color: var(--fg-2); border-color: rgba(94,106,210,0.4); }
.op-author-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
.op-author-row label { font-size: 12px; color: var(--muted); white-space: nowrap; }
.op-author-row input { padding: 6px 9px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--fg); width: 150px; font-size: var(--text-sm); }
.op-reply-row { display: flex; gap: 8px; }
.op-reply-row input[type=text] { flex: 1; padding: 10px 12px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--fg); font-size: var(--text-sm); }
.op-reply-row input[type=text]:focus { outline: none; border-color: var(--accent); }

/* ── Tenants table ────────────────────────────────────────────────── */
.tt-grid { --cols: 30px minmax(150px,1.2fr) minmax(160px,1.5fr) 92px 96px 168px 108px 30px; }
.table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-top: var(--space-5); }
.tt-head, .tt-row { display: grid; grid-template-columns: var(--cols); align-items: center; }
.tt-head { padding: 10px var(--space-4); border-bottom: 1px solid var(--border-soft); background: rgba(255,255,255,0.015); }
.tt-head span { font-size: 11px; font-weight: 590; text-transform: uppercase; letter-spacing: 0.05em; color: var(--meta); }
.tt-row { padding: 11px var(--space-4); border-bottom: 1px solid var(--border-soft); cursor: pointer; transition: background var(--motion-fast) var(--ease-standard); }
.tt-row:hover { background: rgba(255,255,255,0.025); }
.tt-row:last-child { border-bottom: none; }
.tt-row.expanded { background: rgba(94,106,210,0.05); }
.tt-row.flash { animation: flashSuccess 1.6s var(--ease-standard); }
@keyframes flashSuccess { 0% { background: rgba(39,166,68,0.16); } 100% { background: transparent; } }
.tt-cell { font-size: var(--text-sm); color: var(--fg-2); padding-right: var(--space-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tt-cell.slug { font-family: var(--font-mono); color: var(--fg); font-size: 13px; font-weight: 500; }

};
function ic(name, cls) { return `<svg class="icon ${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[name]}</svg>`; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
function fmtDate(iso) { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }); }
function fmtTime(iso) { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }); }
function fmtWait(iso) {
  if (!iso) return '';
  const diffMin = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (diffMin < 1) return 'just now';
  if (diffMin < 60) return `${diffMin} min waiting`;
  const h = Math.floor(diffMin / 60), m = diffMin % 60;
  return `${h}h ${m}min waiting`;
}
function fmtWaWindow(seconds) {
  if (seconds === null || seconds === undefined) return null;
  if (seconds <= 0) return 'WhatsApp window expired';
  const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60);
  return `${h}h ${m}min window left`;
}

const OPERATOR_KEY_STORAGE = 'lgb_admin_operator_key';
function operatorKey() { return localStorage.getItem(OPERATOR_KEY_STORAGE) || ''; }
async function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({ 'X-Operator-Key': operatorKey() }, opts.headers || {});
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  let data = null;
  try { data = await res.json(); } catch { data = null; }
  if (!res.ok) {
    const detail = data && data.detail;
    const message = (detail && typeof detail === 'object' ? detail.error : detail) || `Request failed (${res.status})`;
    const err = new Error(message);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}
async function verifyKey(key) {
  const res = await fetch('/admin/tenants', { headers: { 'X-Operator-Key': key } });
  return res.ok;
}

function toast(msg, type) {

  el.className = `toast ${type||''}`;

/* ── Login ────────────────────────────────────────────────────────── */
function showApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-shell').classList.remove('hidden');
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('login-password');
  const errBox = document.getElementById('login-error');
  const btn = document.getElementById('login-submit');
  const val = input.value.trim();
  if (!val) {
    document.getElementById('login-error-text').textContent = 'Operator key required.';
    errBox.classList.add('show');
    input.focus();
    return;
  }
  errBox.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Verifying…';
  try {
    const ok = await verifyKey(val);
    if (!ok) throw new Error('bad key');
    localStorage.setItem(OPERATOR_KEY_STORAGE, val);
    input.value = '';
    showApp();
    await bootstrap();
  } catch {
    document.getElementById('login-error-text').textContent = 'Invalid operator key. Try again.';
    errBox.classList.add('show');
    input.focus();
  } finally {
    btn.disabled = false;
    btn.textContent = 'Unlock';
  }
});

/* ── Nav ──────────────────────────────────────────────────────────── */
document.getElementById('sidebar-nav').addEventListener('click', (e) => {
  const btn = e.target.closest('.nav-item[data-tab]');
  if (!btn) return;
  const leavingOperator = state.activeTab === 'operator' && btn.dataset.tab !== 'operator';
  state.activeTab = btn.dataset.tab;
  state.expandedTenant = null;
  state.addTenantOpen = false;
  render();
  if (leavingOperator && state.opPollTimer) { clearInterval(state.opPollTimer); state.opPollTimer = null; }
  if (state.activeTab === 'overview') {
    fetchOverview();
  } else if (state.activeTab === 'documents') {
    if (!state.docsTenant && state.tenants.length) state.docsTenant = state.tenants[0].slug;
    if (state.docsTenant) fetchChunkFiles();
  } else if (state.activeTab === 'jobs') {
    fetchJobs();
  } else if (state.activeTab === 'operator') {
    fetchOpPending();
    if (state.opPollTimer) clearInterval(state.opPollTimer);
    state.opPollTimer = setInterval(fetchOpPending, 8000);
  }
});
document.querySelector('.sidebar-footer').addEventListener('click', (e) => {
  if (e.target.closest('[data-action="logout"]')) {
    if (state.opPollTimer) clearInterval(state.opPollTimer);
    localStorage.removeItem(OPERATOR_KEY_STORAGE);
    location.reload();
  }
});

/* ── Render root ──────────────────────────────────────────────────── */
function render() {
  document.querySelectorAll('.nav-item[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === state.activeTab));
  const main = document.getElementById('main-view');
  main.classList.toggle('no-pad', state.activeTab === 'operator');

  // Preserve focus/cursor across the full innerHTML replace below — a search
  // input mid-keystroke must not lose the caret just because state changed.
  const active = document.activeElement;
  const focusId = active && active.id && main.contains(active) ? active.id : null;
  const hasSelection = focusId && 'selectionStart' in active;
  const selStart = hasSelection ? active.selectionStart : null;
  const selEnd = hasSelection ? active.selectionEnd : null;

  if (state.activeTab === 'overview') main.innerHTML = renderOverviewView();
  else if (state.activeTab === 'tenants') main.innerHTML = renderTenantsView();
  else if (state.activeTab === 'documents') main.innerHTML = renderDocumentsView();
  else if (state.activeTab === 'operator') main.innerHTML = renderOperatorView();
  else main.innerHTML = renderJobsView();
  bindViewEvents();

  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus();
      if (selStart !== null) { try { el.setSelectionRange(selStart, selEnd); } catch {} }
    }
  }
  if (state.flashSlug) {
    const row = main.querySelector(`.tt-row[data-slug="${CSS.escape(state.flashSlug)}"]`);
    if (row) row.classList.add('flash');
    state.flashSlug = null;
  }
}

function updateOperatorNavCount() {

}

  await Promise.all([fetchTenants(), fetchVerticals()]);
  if (!state.docsTenant && state.tenants.length) state.docsTenant = state.tenants[0].slug;
  render();
  fetchOverview();
}

async function fetchVerticals() {
  try {

  } catch {
    state.verticals = [];
  }
}

// value never silently disappears from its own dropdown), blank-first.
function verticalOptions(current) {
  const set = new Set(state.verticals);
  if (current) set.add(current);
  return [''].concat([...set].sort());
}

async function fetchTenants() {
  state.tenantsLoading = true;
  state.tenantsError = '';
  render();
  try {
    state.tenants = await api('/admin/tenants');
  } catch (err) {
    state.tenantsError = err.message;
  }
  state.tenantsLoading = false;
  render();
}

async function fetchOverview() {
  if (!state.tenants.length) await fetchTenants();
  const [pending, docsAgg, jobs] = await Promise.all([
    api('/operator/pending').then(r => r.length).catch(() => null),
    Promise.all(state.tenants.map(t =>
      api(`/admin/tenants/${encodeURIComponent(t.slug)}/chunks/files`).catch(() => [])
    )).then(lists => {
      const flat = lists.flat();
      return { files: flat.length, chunks: flat.reduce((a, f) => a + f.chunk_count, 0) };
    }),
    Promise.all(state.tenants.map(async (t) => {
      const jobs = await api(`/admin/index?tenant_slug=${encodeURIComponent(t.slug)}`).catch(() => []);
      return jobs.map(j => Object.assign({ tenant: t.slug }, j));
    })).then(results => results.flat().sort((a, b) => new Date(b.created_at) - new Date(a.created_at))),
  ]);
  state.pendingCount = pending;
  state.docsAgg = docsAgg;
  state.overviewJobs = jobs;
  updateOperatorNavCount();
  if (state.activeTab === 'overview') render();
}

        </div>` : ''}
      </div>
    </div>
  </div>`;

function renderDocumentsView() {
  const files = state.chunkFiles;
  const totalChunks = files.reduce((a,f)=>a+f.chunk_count,0);
  return `
  <div class="view-header">
    <div><h2 data-od-id="documents-heading">Documents</h2><p>Manage the knowledge base per tenant${state.docsTenant ? ` · ${files.length} files, ${totalChunks} chunks for this tenant` : ''}</p></div>
  </div>
  <div class="docs-toolbar">
    <div class="select-wrap">
      <select id="docs-tenant-select" data-od-id="documents-tenant-select" ${state.docsUploading?'disabled':''}>
        ${!state.docsTenant ? `<option value="">Select tenant…</option>` : ''}
        ${state.tenants.map(t=>`<option value="${esc(t.slug)}" ${t.slug===state.docsTenant?'selected':''}>${esc(t.slug)}</option>`).join('')}
      </select>
    </div>
  </div>
  <div class="table-card" style="padding:var(--space-6)">
    <div class="dropzone" id="dropzone" data-od-id="documents-upload-zone">
      <div class="dz-icon">${ic('upload','icon-lg')}</div>
      ${state.docsFile
        ? `<strong>File selected</strong><span class="chosen-file">${esc(state.docsFile.name)} · ${(state.docsFile.size/1024).toFixed(0)} KB</span><p>Drop a different file to replace it, or upload below.</p>`
        : `<strong>Drag & drop a file here</strong><p>PDF, Markdown, or JSONL · or click to browse</p>`}
      <input type="file" id="file-input" accept=".pdf,.md,.markdown,.jsonl" style="display:none">
    </div>
    <div class="upload-options">
      <label class="warn-check ${state.docsReplaceAll?'active':''}" id="replace-all-label">
        <input type="checkbox" id="replace-all-checkbox" data-od-id="documents-replace-all-checkbox" ${state.docsReplaceAll?'checked':''}>
        <span>Replace ALL documents for <strong>${esc(state.docsTenant||'—')}</strong> — this deletes existing indexed chunks before indexing the new one.</span>
      </label>
      <button class="btn btn-primary" id="upload-btn" data-od-id="documents-upload-btn" ${!state.docsFile || !state.docsTenant || state.docsUploading ? 'disabled':''}>${state.docsUploading ? 'Indexing…' : 'Upload & index'}</button>
    </div>
    ${state.docsUploadError ? `<div class="inline-error show" style="margin-top:var(--space-4)">${ic('alert')}<span>${esc(state.docsUploadError)}</span></div>` : ''}
    ${state.docsUploading ? `
    <div class="indexing-status">
      <div class="row-top"><span class="fname mono">${esc(state.docsProgress.filename)}</span><span class="count">${state.docsProgress.total > 0 ? `${state.docsProgress.done} / ${state.docsProgress.total} chunks` : state.docsProgress.status}</span></div>
      <div class="progress"><div class="progress-fill striped" style="width:${state.docsProgress.total > 0 ? Math.min(100, Math.round(state.docsProgress.done/state.docsProgress.total*100)) : 8}%"></div></div>
    </div>` : ''}
  </div>

  <div class="data-table-card" data-od-id="documents-files-table">
    <table class="data-table">
      <thead><tr><th>File</th><th>Chunks</th><th></th></tr></thead>
      <tbody>
        ${!state.docsTenant ? `<tr><td colspan="3"><div class="empty-state">Select a tenant to see its indexed files.</div></td></tr>` : ''}
        ${state.docsTenant && state.chunkFilesLoading ? `<tr><td colspan="3"><div class="empty-state">Loading…</div></td></tr>` : ''}
        ${state.docsTenant && !state.chunkFilesLoading && state.chunkFilesError ? `<tr><td colspan="3"><div class="empty-state">${esc(state.chunkFilesError)}</div></td></tr>` : ''}
        ${state.docsTenant && !state.chunkFilesLoading && !state.chunkFilesError && files.length === 0 ? `<tr><td colspan="3"><div class="empty-state">No documents indexed yet for this tenant.</div></td></tr>` : ''}
        ${state.docsTenant && !state.chunkFilesLoading && !state.chunkFilesError ? files.map(f => `
        <tr>
          <td class="file-name">${esc(f.filename)}</td>
          <td class="chunk-count">${f.chunk_count}</td>
          <td style="text-align:right"><button class="btn btn-icon" data-action="delete-file" data-name="${esc(f.filename)}" title="Delete file" ${state.deletingFile===f.filename?'disabled':''}>${ic('trash', state.deletingFile===f.filename?'spinning':'')}</button></td>
        </tr>`).join('') : ''}
      </tbody>
    </table>
  </div>`;
}

/* ── Jobs view ────────────────────────────────────────────────────── */
function jobBadge(status) {
  const s = String(status||'').toLowerCase();
  const dotColor = { pending:'#62666d', running:'#a7b0ff', done:'#4fd977', failed:'#ff8a8a' };
  return `<span class="badge badge-job-${s}"><span class="dot" style="background:${dotColor[s]||'#62666d'}"></span>${s}</span>`;
}
function renderJobsView() {
  const all = state.jobs;
  const counts = {
    all: all.length,
    PENDING: all.filter(j => j.status === 'PENDING').length,
    RUNNING: all.filter(j => j.status === 'RUNNING').length,
    DONE: all.filter(j => j.status === 'DONE').length,
    FAILED: all.filter(j => j.status === 'FAILED').length,
  };
  const sorted = state.jobsStatusFilter === 'all' ? all : all.filter(j => j.status === state.jobsStatusFilter);
  const chip = (value, label) => `<button class="filter-chip ${state.jobsStatusFilter===value?'active':''}" data-action="jobs-status-filter" data-value="${value}">${label} <span class="count">${counts[value]}</span></button>`;
  return `
  <div class="view-header">
    <div><h2 data-od-id="jobs-heading">Indexing jobs</h2><p>${sorted.length} job${sorted.length===1?'':'s'} shown</p></div>
    <div class="toolbar">
      <div class="select-wrap">
        <select id="jobs-filter-select" data-od-id="jobs-filter-select">
          <option value="all" ${state.jobsFilter==='all'?'selected':''}>All tenants</option>
          ${state.tenants.map(t=>`<option value="${esc(t.slug)}" ${state.jobsFilter===t.slug?'selected':''}>${esc(t.slug)}</option>`).join('')}
        </select>
      </div>
      <button class="btn btn-icon" id="jobs-refresh-btn" title="Refresh">${ic('refresh', state.jobsLoading?'spinning':'')}</button>
    </div>
  </div>
  <div class="toolbar" style="margin-bottom:var(--space-4)">
    ${chip('all','All')} ${chip('PENDING','Pending')} ${chip('RUNNING','Running')} ${chip('DONE','Done')} ${chip('FAILED','Failed')}
  </div>
  <div class="data-table-card" data-od-id="jobs-table">
    <table class="data-table">
      <thead><tr><th>File</th><th>Tenant</th><th>Status</th><th>Progress</th><th>Error</th><th>Timestamp</th></tr></thead>
      <tbody>
        ${state.jobsLoading ? `<tr><td colspan="6"><div class="empty-state">Loading…</div></td></tr>` : ''}
        ${!state.jobsLoading && sorted.length ? sorted.map(j => `
        <tr>
          <td class="file-name">${esc(j.filename)}</td>
          <td class="mono" style="font-size:13px;color:var(--fg-2)">${esc(j.tenant)}</td>
          <td>${jobBadge(j.status)}</td>
          <td>${j.chunks_total > 0 ? `<div class="job-progress-cell"><div class="progress"><div class="progress-fill ${j.status==='RUNNING'?'striped':''}" style="width:${Math.round(j.chunks_done/j.chunks_total*100)}%"></div></div><span class="count">${j.chunks_done}/${j.chunks_total}</span></div>` : `<span class="ts">—</span>`}</td>
          <td>${j.error_message ? `<span class="err-text">${esc(j.error_message)}</span>` : '<span class="ts">—</span>'}</td>
          <td class="ts">${fmtTime(j.created_at)}</td>
        </tr>`).join('') : ''}
        ${!state.jobsLoading && !sorted.length ? `<tr><td colspan="6"><div class="empty-state">No jobs yet.</div></td></tr>` : ''}
      </tbody>
    </table>
  </div>`;
}

/* ── Event binding (delegated per-view) ──────────────────────────── */
function bindViewEvents() {
  const main = document.getElementById('main-view');

  main.addEventListener('click', onMainClick);
  main.addEventListener('input', onMainInput);
  main.addEventListener('change', onMainChange);
  main.addEventListener('submit', onMainSubmit);

  const dz = document.getElementById('dropzone');
  if (dz) {
    dz.addEventListener('click', () => document.getElementById('file-input').click());
    dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
    dz.addEventListener('drop', (e) => {
      e.preventDefault(); dz.classList.remove('dragover');
      if (e.dataTransfer.files.length) { state.docsFile = e.dataTransfer.files[0]; render(); }
    });
    document.getElementById('file-input').addEventListener('change', (e) => {
      if (e.target.files.length) { state.docsFile = e.target.files[0]; render(); }
    });
  }

  const refreshBtn = document.getElementById('jobs-refresh-btn');
  if (refreshBtn) refreshBtn.addEventListener('click', fetchJobs);
}

function onMainClick(e) {
  const row = e.target.closest('[data-action="toggle-expand"]');
  const actionEl = e.target.closest('[data-action]');
  if (!actionEl) return;
  const action = actionEl.dataset.action;
  const slug = actionEl.dataset.slug;

  switch (action) {
    case 'toggle-add-tenant':
      state.addTenantOpen = !state.addTenantOpen;
      state.addTenantError = '';
      state.addTenantResult = null;
      render();
      break;
    case 'toggle-expand': {
      const rowSlug = row.dataset.slug;
      const opening = state.expandedTenant !== rowSlug;
      state.expandedTenant = opening ? rowSlug : null;
      render();
      if (opening && !state.staff[rowSlug]) fetchStaff(rowSlug);
      if (opening && !state.canned[rowSlug]) fetchCanned(rowSlug);
      if (opening && !state.notOffered[rowSlug]) fetchNotOffered(rowSlug);
      break;
    }
    case 'collapse':
      state.expandedTenant = null;
      render();
      break;
    case 'toggle-reveal': {
      e.stopPropagation();
      const key = actionEl.dataset.key;
      state.revealed.has(key) ? state.revealed.delete(key) : state.revealed.add(key);
      render();
      break;
    }
    case 'recheck-webhook': {
      e.stopPropagation();
      recheckWebhook(slug);
      break;
    }
    case 'retry-tenants':
      fetchTenants();
      break;
    case 'save-tenant':
      saveTenant(slug);
      break;
    case 'create-tenant':
      createTenant();
      break;
    case 'add-tenant-done':
      state.addTenantOpen = false;
      state.addTenantResult = null;
      render();
      break;
    case 'regen-start':
      state.regenState[slug] = 'confirm';
      render();
      break;
    case 'regen-cancel':
      state.regenState[slug] = 'idle';
      delete state.regenError[slug];
      render();
      break;
    case 'regen-confirm':
      regenerateKey(slug);
      break;
    case 'regen-done':
      state.regenState[slug] = 'idle';
      delete state.regenKey[slug];
      render();
      break;
    case 'copy-key': {
      const key = actionEl.dataset.key;
      if (key && navigator.clipboard) navigator.clipboard.writeText(key);
      toast('Copied to clipboard.', 'success');
      break;
    }
    case 'delete-start':
      state.deleteState[slug] = 'confirm';
      delete state.deleteError[slug];
      render();
      break;
    case 'delete-cancel':
      state.deleteState[slug] = 'idle';
      delete state.deleteError[slug];
      render();
      break;
    case 'delete-confirm':
      deleteTenant(slug);
      break;
    case 'delete-file':
      deleteFile(actionEl.dataset.name);
      break;
    case 'add-staff':
      addStaffMember(slug);
      break;
    case 'remove-staff':
      removeStaffMember(slug, Number(actionEl.dataset.staffId));
      break;
    case 'canned-add-open':
      state.cannedFormOpen[slug] = true;
      state.cannedEditingId[slug] = null;
      delete state.cannedFormError[slug];
      render();
      break;
    case 'canned-edit':
      state.cannedFormOpen[slug] = true;
      state.cannedEditingId[slug] = Number(actionEl.dataset.id);
      delete state.cannedFormError[slug];
      render();
      break;
    case 'canned-cancel-form':
      state.cannedFormOpen[slug] = false;
      state.cannedEditingId[slug] = null;
      delete state.cannedFormError[slug];
      render();
      break;
    case 'canned-save':
      saveCannedAnswer(slug);
      break;
    case 'canned-remove':
      removeCannedAnswer(slug, Number(actionEl.dataset.id));
      break;
    case 'not-offered-add-open':
      state.notOfferedFormOpen[slug] = true;
      state.notOfferedEditingId[slug] = null;
      delete state.notOfferedFormError[slug];
      render();
      break;
    case 'not-offered-edit':
      state.notOfferedFormOpen[slug] = true;
      state.notOfferedEditingId[slug] = Number(actionEl.dataset.id);
      delete state.notOfferedFormError[slug];
      render();
      break;
    case 'not-offered-cancel-form':
      state.notOfferedFormOpen[slug] = false;
      state.notOfferedEditingId[slug] = null;
      delete state.notOfferedFormError[slug];
      render();
      break;
    case 'not-offered-save':
      saveNotOfferedTerm(slug);
      break;
    case 'not-offered-remove':
      removeNotOfferedTerm(slug, Number(actionEl.dataset.id));
      break;
    case 'not-offered-download-template':
      downloadNotOfferedTemplate(slug);
      break;
    case 'not-offered-upload':
      uploadNotOfferedTerms(slug);
      break;
    case 'jobs-status-filter':
      state.jobsStatusFilter = actionEl.dataset.value;
      render();
      break;
    case 'goto-tab': {
      const tab = actionEl.dataset.tab;
      state.activeTab = tab;
      if (actionEl.dataset.jobsStatusFilter) state.jobsStatusFilter = actionEl.dataset.jobsStatusFilter;
      if (actionEl.dataset.addTenant) state.addTenantOpen = true;
      render();
      if (tab === 'documents' && !state.docsTenant && state.tenants.length) { state.docsTenant = state.tenants[0].slug; fetchChunkFiles(); }
      if (tab === 'jobs') fetchJobs();
      if (tab === 'operator') {
        fetchOpPending();
        if (state.opPollTimer) clearInterval(state.opPollTimer);
        state.opPollTimer = setInterval(fetchOpPending, 8000);
      }
      break;
    }
    case 'op-select-thread':
      opSelectThread(actionEl.dataset.threadId);
      break;
    case 'op-end-control':
      opEndControl();
      break;
    case 'op-use-canned':
      document.getElementById('op-reply-text').value = actionEl.dataset.text;
      document.getElementById('op-reply-text').focus();
      break;
    case 'op-filter': {
      state.opFilter = actionEl.dataset.value;
      render();
      break;
    }
  }
}

function onMainInput(e) {
  if (e.target.dataset.actionInput === 'delete-confirm-input') {
    const slug = e.target.dataset.slug;
    const btn = e.target.closest('.confirm-inline').querySelector('[data-action="delete-confirm"]');
    btn.disabled = e.target.value !== slug;
  } else if (e.target.id === 'tenants-search-input') {
    state.tenantsSearch = e.target.value;
    render();
  } else if (e.target.id === 'op-search-input') {
    state.opSearch = e.target.value;
    render();
  }
}

function onMainChange(e) {
  if (e.target.id === 'docs-tenant-select') {
    state.docsTenant = e.target.value;
    state.docsFile = null;
    state.docsReplaceAll = false;
    state.chunkFiles = [];
    render();
    fetchChunkFiles();
  } else if (e.target.id === 'jobs-filter-select') {
    state.jobsFilter = e.target.value;
    fetchJobs();
  } else if (e.target.id === 'replace-all-checkbox') {
    state.docsReplaceAll = e.target.checked;
    document.getElementById('replace-all-label').classList.toggle('active', state.docsReplaceAll);
  } else if (e.target.id === 'tenants-plan-filter') {
    state.tenantsPlanFilter = e.target.value;
    render();
  } else if (e.target.id === 'tenants-status-filter') {
    state.tenantsStatusFilter = e.target.value;
    render();
  }
}

function onMainSubmit(e) {
  if (e.target.id === 'op-reply-form') {
    e.preventDefault();
    opSendReply();
  }
}

document.getElementById('main-view')?.addEventListener('click', (e) => {
  if (e.target.closest('#upload-btn')) startUpload();
});

/* ── Tenant actions ───────────────────────────────────────────────── */
async function recheckWebhook(slug) {
  state.webhookChecking.add(slug);
  render();
  try {
    const data = await api(`/admin/tenants/${encodeURIComponent(slug)}/webhook-status`);
    state.webhookStatus[slug] = data.status;
    toast(`Webhook recheck for ${slug}: ${data.status}`, data.status === 'registered' ? 'success' : data.status === 'error' ? 'error' : undefined);
  } catch (err) {
    state.webhookStatus[slug] = 'error';
    toast(`Webhook recheck failed: ${err.message}`, 'error');
  }
  state.webhookChecking.delete(slug);
  render();
}

async function saveTenant(slug) {
  const panel = document.querySelector(`[data-od-id="expand-panel-${CSS.escape(slug)}"]`);
  const get = (field) => panel.querySelector(`[data-field="${field}"]`);
  const payload = {
    plan: get('plan').value,
    expertise_area: get('expertise_area').value.trim(),
    specialization_context: get('specialization_context').value.trim(),
    contact_url: get('contact_url').value.trim(),
    tone_description: get('tone_description').value.trim(),
    greeting_message: get('greeting_message').value.trim(),
    results_turnaround: get('results_turnaround').value.trim(),
    catalog_is_closed: get('catalog_is_closed').checked,
    not_offered_message: get('not_offered_message').value.trim(),
    vertical: get('vertical').value.trim(),
    active: get('active').checked,
  };
  const botToken = get('bot_token').value.trim();
  const webhookSecret = get('webhook_secret').value.trim();
  const waPhone = get('wa_phone_number_id').value.trim();
  const waAccess = get('wa_access_token').value.trim();
  const waSecret = get('wa_app_secret').value.trim();
  const waVerify = get('wa_verify_token').value.trim();
  if (botToken) payload.bot_token = botToken;
  if (webhookSecret) payload.webhook_secret = webhookSecret;
  if (waPhone) payload.wa_phone_number_id = waPhone;
  if (waAccess) payload.wa_access_token = waAccess;
  if (waSecret) payload.wa_app_secret = waSecret;
  if (waVerify) payload.wa_verify_token = waVerify;

  state.saveLoading.add(slug);
  delete state.saveError[slug];
  render();
  try {
    const data = await api(`/admin/tenants/${encodeURIComponent(slug)}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const t = state.tenants.find(x => x.slug === slug);
    Object.assign(t, {
      plan: data.plan, expertise_area: data.expertise_area, specialization_context: data.specialization_context,
      contact_url: data.contact_url, tone_description: data.tone_description, active: data.active,
      greeting_message: data.greeting_message, results_turnaround: data.results_turnaround,
      catalog_is_closed: data.catalog_is_closed, not_offered_message: data.not_offered_message,
      vertical: data.vertical,
    });
    state.saveLoading.delete(slug);
    state.expandedTenant = null;
    state.flashSlug = slug;
    render();
    toast(`Saved changes for ${slug}.`, 'success');
    if (data.webhook_registered === false) {
      toast('Webhook registration failed — check the Telegram bot token and try again.', 'error');
    }
  } catch (err) {
    state.saveLoading.delete(slug);
    state.saveError[slug] = err.message;
    render();
  }
}

async function createTenant() {
  const slug = document.getElementById('new-slug').value.trim();
  const botToken = document.getElementById('new-bot-token').value.trim();
  const webhookSecret = document.getElementById('new-webhook-secret').value.trim();
  const plan = document.getElementById('new-plan').value;
  const expertise = document.getElementById('new-expertise').value.trim();
  const specialization = document.getElementById('new-specialization-context').value.trim();
  const contact = document.getElementById('new-contact').value.trim();
  const greeting = document.getElementById('new-greeting-message').value.trim();
  const resultsTurnaround = document.getElementById('new-results-turnaround').value.trim();
  const vertical = document.getElementById('new-vertical').value.trim();
  if (!slug || !botToken || !webhookSecret) {
    state.addTenantError = 'Slug, bot token, and webhook secret are required.';
    render();
    return;
  }
  state.addTenantSaving = true;
  state.addTenantError = '';
  render();
  try {
    const data = await api('/admin/tenants', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        slug, bot_token: botToken, webhook_secret: webhookSecret, plan,
        expertise_area: expertise, specialization_context: specialization, contact_url: contact,
        greeting_message: greeting || null,
        results_turnaround: resultsTurnaround || null,
        vertical: vertical || null,
      }),
    });
    state.addTenantResult = { slug: data.slug, api_key: data.api_key };
    await fetchTenants();
  } catch (err) {
    state.addTenantError = err.message;
  }
  state.addTenantSaving = false;
  render();
}

async function regenerateKey(slug) {
  state.regenState[slug] = 'loading';
  render();
  try {
    const data = await api(`/admin/tenants/${encodeURIComponent(slug)}/regen-key`, { method: 'POST' });
    state.regenKey[slug] = data.api_key;
    state.regenState[slug] = 'revealed';
    toast(`API key regenerated for ${slug}.`, 'success');
  } catch (err) {
    state.regenError[slug] = err.message;
    state.regenState[slug] = 'error';
  }
  render();
}

async function deleteTenant(slug) {
  state.deleteState[slug] = 'loading';
  delete state.deleteError[slug];
  render();
  try {
    await api(`/admin/tenants/${encodeURIComponent(slug)}`, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ confirm_slug: slug }),
    });
    state.tenants = state.tenants.filter(t => t.slug !== slug);
    delete state.webhookStatus[slug];
    delete state.regenState[slug];
    delete state.deleteState[slug];
    delete state.staff[slug];
    delete state.canned[slug];
    delete state.notOffered[slug];
    state.expandedTenant = null;
    render();
    toast(`Tenant "${slug}" deleted.`, 'success');
  } catch (err) {
    state.deleteError[slug] = err.message;
    state.deleteState[slug] = 'confirm';
    render();
  }
}

/* ── Staff actions ────────────────────────────────────────────────── */
async function fetchStaff(slug) {
  state.staffLoading[slug] = true;
  state.staffError[slug] = '';
  render();
  try {
    state.staff[slug] = await api(`/admin/tenants/${encodeURIComponent(slug)}/staff`);
  } catch (err) {
    state.staffError[slug] = err.message;
    state.staff[slug] = [];
  }
  state.staffLoading[slug] = false;
  render();
}

async function addStaffMember(slug) {
  const panel = document.querySelector(`[data-od-id="staff-section-${CSS.escape(slug)}"]`);
  const channel = panel.querySelector('[data-field="staff-channel"]').value;
  const identifierEl = panel.querySelector('[data-field="staff-identifier"]');
  const identifier = identifierEl.value.trim();
  if (!identifier) {
    state.staffAddError[slug] = 'Identifier is required.';
    render();
    return;
  }
  state.staffAdding[slug] = true;
  state.staffAddError[slug] = '';
  render();
  try {
    await api(`/admin/tenants/${encodeURIComponent(slug)}/staff`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ channel, identifier }),
    });
    await fetchStaff(slug);
    toast(`Added ${identifier} as staff on ${channel}.`, 'success');
  } catch (err) {
    state.staffAddError[slug] = err.message;
  }
  state.staffAdding[slug] = false;
  render();
}

async function removeStaffMember(slug, staffId) {
  try {
    await api(`/admin/tenants/${encodeURIComponent(slug)}/staff/${staffId}`, { method: 'DELETE' });
    state.staff[slug] = (state.staff[slug] || []).filter(s => s.id !== staffId);
    render();
    toast('Staff member removed.', 'success');
  } catch (err) {
    toast(`Remove failed: ${err.message}`, 'error');
  }
}

/* ── Canned answers actions ───────────────────────────────────────── */
async function fetchCanned(slug) {
  state.cannedLoading[slug] = true;
  state.cannedError[slug] = '';
  render();
  try {
    state.canned[slug] = await api(`/admin/tenants/${encodeURIComponent(slug)}/canned-answers`);
  } catch (err) {
    state.cannedError[slug] = err.message;
    state.canned[slug] = [];
  }
  state.cannedLoading[slug] = false;
  render();
}

async function saveCannedAnswer(slug) {
  const panel = document.querySelector(`[data-od-id="canned-form-${CSS.escape(slug)}"]`);
  const keywords = panel.querySelector('[data-field="canned-keywords"]').value
    .split(',').map(k => k.trim()).filter(Boolean);
  const matchMode = panel.querySelector('[data-field="canned-match-mode"]').value;
  const answer = panel.querySelector('[data-field="canned-answer"]').value.trim();
  if (keywords.length === 0) {
    state.cannedFormError[slug] = 'Add at least one keyword.';
    render();
    return;
  }
  if (!answer) {
    state.cannedFormError[slug] = 'Answer is required.';
    render();
    return;
  }

  const editingId = state.cannedEditingId[slug];
  state.cannedSaving[slug] = true;
  delete state.cannedFormError[slug];
  render();
  try {
    if (editingId) {
      await api(`/admin/tenants/${encodeURIComponent(slug)}/canned-answers/${editingId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ keywords, match_mode: matchMode, answer }),
      });
    } else {
      await api(`/admin/tenants/${encodeURIComponent(slug)}/canned-answers`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ keywords, match_mode: matchMode, answer }),
      });
    }
    await fetchCanned(slug);
    state.cannedFormOpen[slug] = false;
    state.cannedEditingId[slug] = null;
    toast(editingId ? 'Canned answer updated.' : 'Canned answer added.', 'success');
  } catch (err) {
    state.cannedFormError[slug] = err.message;
  }
  state.cannedSaving[slug] = false;
  render();
}

async function removeCannedAnswer(slug, id) {
  try {
    await api(`/admin/tenants/${encodeURIComponent(slug)}/canned-answers/${id}`, { method: 'DELETE' });
    state.canned[slug] = (state.canned[slug] || []).filter(c => c.id !== id);
    render();
    toast('Canned answer removed.', 'success');
  } catch (err) {
    toast(`Remove failed: ${err.message}`, 'error');
  }
}

/* ── Not-offered terms actions ────────────────────────────────────── */
async function fetchNotOffered(slug) {
  state.notOfferedLoading[slug] = true;
  state.notOfferedError[slug] = '';
  render();
  try {
    state.notOffered[slug] = await api(`/admin/tenants/${encodeURIComponent(slug)}/not-offered-terms`);
  } catch (err) {
    state.notOfferedError[slug] = err.message;
    state.notOffered[slug] = [];
  }
  state.notOfferedLoading[slug] = false;
  render();
}

async function saveNotOfferedTerm(slug) {
  const panel = document.querySelector(`[data-od-id="not-offered-form-${CSS.escape(slug)}"]`);
  const keywords = panel.querySelector('[data-field="not-offered-keywords"]').value
    .split(',').map(k => k.trim()).filter(Boolean);
  const matchMode = panel.querySelector('[data-field="not-offered-match-mode"]').value;
  if (keywords.length === 0) {
    state.notOfferedFormError[slug] = 'Add at least one keyword.';
    render();
    return;
  }

  const editingId = state.notOfferedEditingId[slug];
  state.notOfferedSaving[slug] = true;
  delete state.notOfferedFormError[slug];
  render();
  try {
    if (editingId) {
      await api(`/admin/tenants/${encodeURIComponent(slug)}/not-offered-terms/${editingId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ keywords, match_mode: matchMode }),
      });
    } else {
      await api(`/admin/tenants/${encodeURIComponent(slug)}/not-offered-terms`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ keywords, match_mode: matchMode }),
      });
    }
    await fetchNotOffered(slug);
    state.notOfferedFormOpen[slug] = false;
    state.notOfferedEditingId[slug] = null;
    toast(editingId ? 'Not-offered term updated.' : 'Not-offered term added.', 'success');
  } catch (err) {
    state.notOfferedFormError[slug] = err.message;
  }
  state.notOfferedSaving[slug] = false;
  render();
}

async function removeNotOfferedTerm(slug, id) {
  try {
    await api(`/admin/tenants/${encodeURIComponent(slug)}/not-offered-terms/${id}`, { method: 'DELETE' });
    state.notOffered[slug] = (state.notOffered[slug] || []).filter(c => c.id !== id);
    render();
    toast('Not-offered term removed.', 'success');
  } catch (err) {
    toast(`Remove failed: ${err.message}`, 'error');
  }
}

async function downloadNotOfferedTemplate(slug) {
  try {
    const res = await fetch(`/admin/tenants/${encodeURIComponent(slug)}/not-offered-terms/template`, {
      headers: { 'X-Operator-Key': operatorKey() },
    });
    if (!res.ok) throw new Error(`Request failed (${res.status})`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `not-offered-terms-${slug}-template.xlsx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    toast(`Download failed: ${err.message}`, 'error');
  }
}

async function uploadNotOfferedTerms(slug) {
  const input = document.querySelector(`[data-od-id="not-offered-upload-input-${CSS.escape(slug)}"]`);
  const file = input.files[0];
  if (!file) {
    toast('Choose an .xlsx file first.', 'error');
    return;
  }

  state.notOfferedUploading[slug] = true;
  state.notOfferedUploadError[slug] = '';
  render();
  try {
    const form = new FormData();
    form.append('file', file);
    const data = await api(`/admin/tenants/${encodeURIComponent(slug)}/not-offered-terms/upload`, {
      method: 'POST',
      body: form,
    });
    input.value = '';
    await fetchNotOffered(slug);
    toast(`Imported ${data.imported} not-offered term(s), replacing the previous list.`, 'success');
  } catch (err) {
    state.notOfferedUploadError[slug] = err.message;
  }
  state.notOfferedUploading[slug] = false;
  render();
}

/* ── Documents actions ────────────────────────────────────────────── */
async function fetchChunkFiles() {
  if (!state.docsTenant) return;
  state.chunkFilesLoading = true;
  state.chunkFilesError = '';
  render();
  try {
    state.chunkFiles = await api(`/admin/tenants/${encodeURIComponent(state.docsTenant)}/chunks/files`);
  } catch (err) {
    state.chunkFilesError = err.message;
    state.chunkFiles = [];
  }
  state.chunkFilesLoading = false;
  render();
}

async function deleteFile(filename) {
  state.deletingFile = filename;
  render();
  try {
    const data = await api(`/admin/tenants/${encodeURIComponent(state.docsTenant)}/chunks?source=${encodeURIComponent(filename)}`, { method: 'DELETE' });
    state.chunkFiles = state.chunkFiles.filter(f => f.filename !== filename);
    toast(`Deleted ${data.deleted} chunks from "${filename}".`, 'success');
  } catch (err) {
    toast(`Delete failed: ${err.message}`, 'error');
  }
  state.deletingFile = null;
  render();
}

async function startUpload() {
  if (!state.docsFile || !state.docsTenant || state.docsUploading) return;
  const file = state.docsFile;
  const fd = new FormData();
  fd.append('tenant_slug', state.docsTenant);
  fd.append('file', file);
  fd.append('replace_all', state.docsReplaceAll ? 'true' : 'false');

  state.docsUploading = true;
  state.docsUploadError = '';
  state.docsProgress = { done: 0, total: 0, filename: file.name, status: 'PENDING' };
  render();

  let jobId;
  try {
    const data = await api('/admin/index', { method: 'POST', body: fd });
    jobId = data.job_id;
  } catch (err) {
    state.docsUploading = false;
    state.docsUploadError = err.message;
    render();
    return;
  }
  pollIndexJob(jobId);
}

async function pollIndexJob(jobId) {
  try {
    const job = await api(`/admin/index/${encodeURIComponent(jobId)}`);
    state.docsProgress = { done: job.chunks_done || 0, total: job.chunks_total || 0, filename: job.filename, status: job.status };
    if (job.status === 'DONE') {
      state.docsUploading = false;
      state.docsFile = null;
      state.docsReplaceAll = false;
      render();
      toast(`Indexed ${job.filename} — ${job.chunks_done} chunks.`, 'success');
      fetchChunkFiles();
      return;
    }
    if (job.status === 'FAILED') {
      state.docsUploading = false;
      state.docsUploadError = job.error_message || 'Indexing failed.';
      render();
      toast(`Indexing failed: ${state.docsUploadError}`, 'error');
      return;
    }
    render();
    setTimeout(() => pollIndexJob(jobId), 2000);
  } catch (err) {
    state.docsUploading = false;
    state.docsUploadError = err.message;
    render();
  }
}

/* ── Jobs actions ─────────────────────────────────────────────────── */
async function fetchJobs() {
  state.jobsLoading = true;
  render();
  try {
    const slugs = state.jobsFilter === 'all' ? state.tenants.map(t => t.slug) : [state.jobsFilter];
    const results = await Promise.all(slugs.map(async (slug) => {
      const jobs = await api(`/admin/index?tenant_slug=${encodeURIComponent(slug)}`);
      return jobs.map(j => Object.assign({ tenant: slug }, j));
    }));
    state.jobs = results.flat().sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 100);
  } catch (err) {
    toast(`Failed to load jobs: ${err.message}`, 'error');
    state.jobs = [];
  }
  state.jobsLoading = false;
  render();
}

/* ── Operator view (embedded, shares the same operator key/session) ─── */
function opFilteredThreads() {
  let list = state.opThreads;
  if (state.opFilter === 'urgent') list = list.filter(opIsUrgent);
  if (state.opFilter === 'mine') {
    const me = (localStorage.getItem(OP_AUTHOR_STORAGE) || '').trim();
    list = list.filter(t => t.attending && t.attending === me);
  }
  const q = state.opSearch.trim().toLowerCase();
  if (q) list = list.filter(t => t.tenant_slug.toLowerCase().includes(q) || (t.user_message || '').toLowerCase().includes(q));
  return list;
}

function opSenderChipClass(sender) { return sender === 'operator' ? 'operator' : sender === 'bot' ? 'bot' : 'user'; }
function opSenderLabel(m) {
  if (m.sender === 'operator') return m.author || 'Operator';
  if (m.sender === 'bot') return 'Bot';
  return 'User';
}

function renderOpThreadRow(t) {
  const active = t.thread_id === state.opSelectedThreadId;
  const win = fmtWaWindow(t.wa_window_remaining_seconds);
  const urgent = opIsUrgent(t);
  return `
  <button type="button" class="op-thread-row ${active?'active':''}" data-action="op-select-thread" data-thread-id="${esc(t.thread_id)}">
    <div class="op-row-top">
      <span class="op-row-id"><span class="op-channel-dot ${esc(t.channel)}"></span>${esc(t.tenant_slug)} · ${esc(t.channel)}</span>
      <span>${esc(fmtWait(t.interrupt_started_at))}</span>
    </div>
    <div class="op-row-preview">${esc(t.user_message || '(no text)')}</div>
    <div class="op-row-meta">
      ${t.attending ? `<span class="op-tag attending">Attending: ${esc(t.attending)}</span>` : ''}
      ${win ? `<span class="op-tag ${urgent?'urgent':''}">${esc(win)}</span>` : ''}
    </div>
  </button>`;
}

function renderOpDetail(thread) {
  const savedAuthor = localStorage.getItem(OP_AUTHOR_STORAGE) || '';
  return `
  <div class="op-detail-header">
    <div>
      <div class="title">${esc(thread.tenant_slug)}</div>
      <div class="sub"><span class="op-channel-dot ${esc(thread.channel)}"></span>${esc(thread.channel)} · <span class="mono">${esc(thread.thread_id)}</span></div>
    </div>
    <button class="btn btn-danger-outline btn-sm" data-action="op-end-control">End human control</button>
  </div>
  <div class="op-messages" id="op-messages-scroll">
    ${state.opLoadingDetail ? `<div class="empty-state">Loading…</div>` : (state.opMessages||[]).map(m => `
    <div class="op-msg-row ${m.sender==='operator'?'self':'other'}">
      <div class="op-msg-meta">
        <span class="op-sender-chip ${opSenderChipClass(m.sender)}">${esc(opSenderLabel(m))}</span>
        ${m.created_at ? `<span>${fmtTime(m.created_at)}</span>` : ''}
      </div>
      <div class="op-msg-bubble">${esc(m.content)}</div>
    </div>`).join('')}
  </div>
  <div class="op-reply-area">
    <div class="inline-error ${state.opReplyError?'show':''}">${ic('alert')}<span>${esc(state.opReplyError)}</span></div>
    <div class="op-canned-row">
      ${OP_CANNED_REPLIES.map(text => `<button type="button" class="op-canned-chip" data-action="op-use-canned" data-text="${esc(text)}">${esc(text)}</button>`).join('')}
    </div>
    <div class="op-author-row">
      <label>Your name</label>
      <input type="text" id="op-author-input" placeholder="María" value="${esc(savedAuthor)}">
    </div>
    <form class="op-reply-row" id="op-reply-form">
      <input type="text" id="op-reply-text" placeholder="Type a reply…" autocomplete="off">
      <button type="submit" class="btn btn-primary">Send</button>
    </form>
  </div>`;
}

function renderOperatorView() {
  const threads = opFilteredThreads();
  const me = (localStorage.getItem(OP_AUTHOR_STORAGE) || '').trim();
  const counts = {
    all: state.opThreads.length,
    urgent: state.opThreads.filter(opIsUrgent).length,
    mine: state.opThreads.filter(t => t.attending && t.attending === me).length,
  };
  const chip = (value, label) => `<button type="button" class="filter-chip ${state.opFilter===value?'active':''}" data-action="op-filter" data-value="${value}">${label} <span class="count">${counts[value]}</span></button>`;
  const selected = state.opThreads.find(t => t.thread_id === state.opSelectedThreadId) || null;

  return `
  <div class="op-shell">
    <div class="op-list-pane">
      <div class="op-list-header">
        <h1 data-od-id="operator-heading">Conversations</h1>
        <div class="search-box">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="op-search-input" placeholder="Search tenant or message…" value="${esc(state.opSearch)}" autocomplete="off">
        </div>
        <div class="op-chip-row">
          ${chip('all','All')} ${chip('urgent','Urgent')} ${chip('mine','Assigned to me')}
        </div>
      </div>
      <div class="op-thread-list" data-od-id="operator-thread-list">
        ${state.opThreadsLoading && !state.opThreads.length ? `<div class="empty-state">Loading…</div>` : ''}
        ${!state.opThreadsLoading && !threads.length ? `<div class="empty-state">${state.opThreads.length ? 'No conversation matches the filter.' : 'No conversations waiting.'}</div>` : ''}
        ${threads.map(t => renderOpThreadRow(t)).join('')}
      </div>
    </div>
    <div class="op-detail-pane">
      ${selected ? renderOpDetail(selected) : `<div class="op-detail-empty">Select a conversation from the list.</div>`}
    </div>
  </div>`;
}

async function fetchOpPending() {
  state.opThreadsLoading = state.opThreads.length === 0;
  if (state.activeTab === 'operator') render();
  try {
    state.opThreads = await api('/operator/pending');
    state.pendingCount = state.opThreads.length;
    updateOperatorNavCount();
  } catch (err) {
    if (err.status === 401 && state.opPollTimer) { clearInterval(state.opPollTimer); state.opPollTimer = null; }
  }
  state.opThreadsLoading = false;
  if (state.activeTab === 'operator') render();
}

async function opSelectThread(threadId) {
  state.opSelectedThreadId = threadId;
  state.opLoadingDetail = true;
  state.opReplyError = '';
  render();
  let data = null, failed = false;
  try {
    data = await api(`/operator/threads/${encodeURIComponent(threadId)}`);
  } catch (err) {
    failed = true;
  }
  // A different thread may have been clicked while this request was in
  // flight — an out-of-order response must not overwrite what's now selected.
  if (state.opSelectedThreadId !== threadId) return;
  state.opMessages = failed ? [] : data.messages;
  state.opLoadingDetail = false;
  render();
  const scroll = document.getElementById('op-messages-scroll');
  if (scroll) scroll.scrollTop = scroll.scrollHeight;
}

async function opSendReply() {
  const textInput = document.getElementById('op-reply-text');
  const authorInput = document.getElementById('op-author-input');
  const text = textInput.value.trim();
  const author = authorInput.value.trim();
  if (!text || !author) {
    state.opReplyError = 'Enter your name and a message before sending.';
    render();
    return;
  }
  localStorage.setItem(OP_AUTHOR_STORAGE, author);
  try {
    await api(`/operator/threads/${encodeURIComponent(state.opSelectedThreadId)}/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, author }),
    });
    state.opReplyError = '';
    await opSelectThread(state.opSelectedThreadId);
    await fetchOpPending();
  } catch (err) {
    state.opReplyError = OP_SEND_ERRORS[err.message] || err.message || 'Could not send the message.';
    render();
  }
}

async function opEndControl() {
  if (!state.opSelectedThreadId) return;
  try {
    await api(`/operator/resume/${encodeURIComponent(state.opSelectedThreadId)}`, { method: 'POST' });
    state.opSelectedThreadId = null;
    state.opMessages = [];
    render();
    await fetchOpPending();
  } catch (err) {
    state.opReplyError = err.message || 'Could not end human control.';
    render();
  }
}

/* ── Init ─────────────────────────────────────────────────────────── */
(async function init() {
  if (!operatorKey()) return;
  const ok = await verifyKey(operatorKey());
  if (!ok) { localStorage.removeItem(OPERATOR_KEY_STORAGE); return; }
  showApp();
  await bootstrap();
})();
</script>
