<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>langraph-bot — Admin</title>
<style>
/* ── Linear design-system tokens ─────────────────────────────────── */
:root {
  --bg:           #08090a;
  --surface:      #191a1b;
  --surface-warm: var(--surface);
  --fg:   #f7f8f8;
  --fg-2: #d0d6e0;
  --muted: #8a8f98;
  --meta:  #62666d;
  --border:      rgba(255, 255, 255, 0.08);
  --border-soft: rgba(255, 255, 255, 0.05);
  --accent:        #5e6ad2;
  --accent-on:     #ffffff;
  --accent-hover:  #828fff;
  --accent-active: #4752c4;
  --success: #27a644;
  --warn:    #eab308;
  --danger:  #dc2626;
  --font-display: "Inter Variable", "Inter", "SF Pro Display", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-body:    "Inter Variable", "Inter", "SF Pro Display", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-mono:    "Berkeley Mono", ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
  --text-xs:   12px;
  --text-sm:   14px;
  --text-base: 16px;
  --text-lg:   18px;
  --text-xl:   24px;
  --text-2xl:  32px;
  --text-3xl:  48px;
  --text-4xl:  72px;
  --leading-body:     1.5;
  --leading-tight:    1.00;
  --tracking-display: -0.022em;
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-12: 48px;
  --section-y-desktop: 80px;
  --section-y-tablet:  48px;
  --section-y-phone:   32px;
  --radius-sm:   6px;
  --radius-md:   8px;
  --radius-lg:   12px;
  --radius-pill: 9999px;
  --elev-flat:   none;
  --elev-ring:   0 0 0 1px var(--border);
  --elev-raised: rgba(0, 0, 0, 0.4) 0px 2px 4px, 0 0 0 1px rgba(255, 255, 255, 0.05);
  --focus-ring: 0 0 0 2px color-mix(in oklab, var(--accent), transparent 30%), 0 4px 12px rgba(0, 0, 0, 0.1);
  --motion-fast:   150ms;
  --motion-base:   200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --container-max:            1200px;
  --container-gutter-desktop: 24px;
  --container-gutter-tablet:  16px;
  --container-gutter-phone:   12px;
}

/* ── Reset ────────────────────────────────────────────────────────── */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg-2);
  font-family: var(--font-body);
  font-feature-settings: "cv01", "ss03";
  font-size: var(--text-base);
  line-height: var(--leading-body);
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: var(--text-sm); color: var(--fg); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm);
}
svg.icon { width: 16px; height: 16px; flex: none; }
.icon-lg { width: 20px; height: 20px; }
code, .mono { font-family: var(--font-mono); }
.hidden { display: none !important; }
::selection { background: color-mix(in oklab, var(--accent), transparent 60%); }

/* ── Login screen ─────────────────────────────────────────────────── */
.login-screen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(600px 400px at 50% 20%, rgba(94,106,210,0.10), transparent 70%),
    var(--bg);
  padding: var(--space-6);
}
.login-card {
  width: 100%; max-width: 360px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: var(--space-8) var(--space-6); box-shadow: var(--elev-raised);
}
.login-mark {
  width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--accent);
  display: flex; align-items: center; justify-content: center; color: #fff; margin-bottom: var(--space-5);
}
.login-card h1 {
  font-size: var(--text-xl); font-weight: 510; color: var(--fg); letter-spacing: -0.288px; margin-bottom: var(--space-1);
}
.login-card p.sub { font-size: var(--text-sm); color: var(--muted); margin-bottom: var(--space-6); }
.login-field label {
  display: block; font-size: var(--text-xs); font-weight: 590; color: var(--fg-2); margin-bottom: var(--space-2);
  text-transform: uppercase; letter-spacing: 0.04em;
}
.login-field input {
  width: 100%; background: rgba(255,255,255,0.02); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 12px; color: var(--fg);
}
.login-field input::placeholder { color: var(--meta); }
.login-error, .inline-error {
  display: none; align-items: center; gap: var(--space-2); background: color-mix(in oklab, var(--danger), transparent 85%);
  border: 1px solid color-mix(in oklab, var(--danger), transparent 60%); color: #ff8a8a;
  border-radius: var(--radius-sm); padding: 8px 10px; font-size: var(--text-xs); margin-top: var(--space-3);
}
.login-error.show, .inline-error.show { display: flex; }
.login-submit { width: 100%; margin-top: var(--space-5); }

/* ── Buttons ──────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border-radius: var(--radius-sm); border: 1px solid transparent; font-size: var(--text-sm);
  font-weight: 510; padding: 8px 14px; transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
  white-space: nowrap;
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-ghost { background: rgba(255,255,255,0.02); color: #e2e4e7; border-color: rgb(36,40,44); }
.btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.05); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover:not(:disabled) { background: #ef4444; }
.btn-danger-outline { background: rgba(220,38,38,0.06); color: #ff9d9d; border-color: rgba(220,38,38,0.35); }
.btn-danger-outline:hover:not(:disabled) { background: rgba(220,38,38,0.14); }
.btn-sm { padding: 5px 10px; font-size: var(--text-xs); }
.btn-icon { padding: 6px; border-radius: var(--radius-sm); background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--fg-2); }
.btn-icon:hover:not(:disabled) { background: rgba(255,255,255,0.07); color: var(--fg); }
.btn-block { width: 100%; }

/* ── App shell ────────────────────────────────────────────────────── */
.app-shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
.sidebar {
  background: var(--surface); border-right: 1px solid var(--border-soft);
  display: flex; flex-direction: column; padding: var(--space-4) var(--space-3);
  position: sticky; top: 0; height: 100vh;
}
.sidebar-brand { display: flex; align-items: center; gap: 10px; padding: var(--space-2) var(--space-2) var(--space-6); }
.brand-mark {
  width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 590; font-size: 13px; flex: none;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-text strong { font-size: var(--text-sm); color: var(--fg); font-weight: 590; letter-spacing: -0.1px; }
.brand-text span { font-size: 11px; color: var(--meta); font-family: var(--font-mono); }
.sidebar-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm);
  background: transparent; border: 1px solid transparent; color: var(--muted); font-size: var(--text-sm);
  font-weight: 510; text-align: left; width: 100%;
}
.nav-item:hover { background: rgba(255,255,255,0.04); color: var(--fg-2); }
.nav-item.active { background: rgba(94,106,210,0.14); color: var(--fg); border-color: rgba(94,106,210,0.25); }
.nav-item svg { flex: none; }
.sidebar-footer { display: flex; flex-direction: column; gap: var(--space-2); padding-top: var(--space-4); border-top: 1px solid var(--border-soft); margin-top: var(--space-3); }
.env-tag {
  font-family: var(--font-mono); font-size: 10px; color: var(--success); background: rgba(39,166,68,0.12);
  border: 1px solid rgba(39,166,68,0.3); border-radius: var(--radius-sm); padding: 4px 8px; text-align: center; letter-spacing: 0.04em;
}

.main { padding: var(--space-6) var(--space-8); max-width: 1320px; }
.view-header { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-5); flex-wrap: wrap; }
.view-header h2 { font-size: var(--text-2xl); font-weight: 510; color: var(--fg); letter-spacing: -0.704px; }
.view-header p { font-size: var(--text-sm); color: var(--muted); margin-top: 4px; }
.toolbar { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }

/* ── Badges ───────────────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: var(--radius-pill);
  font-size: 12px; font-weight: 510; border: 1px solid transparent; white-space: nowrap;
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.badge-plan-free { background: rgba(255,255,255,0.04); color: var(--muted); border-color: var(--border); }
.badge-plan-basic { background: rgba(130,143,255,0.10); color: #a7b0ff; border-color: rgba(130,143,255,0.3); }
.badge-plan-pro { background: rgba(94,106,210,0.18); color: #c2c9ff; border-color: rgba(94,106,210,0.45); }
.badge-status-active { background: rgba(39,166,68,0.10); color: #4fd977; border-color: rgba(39,166,68,0.3); }
.badge-status-inactive { background: rgba(255,255,255,0.03); color: var(--meta); border-color: var(--border); }
.badge-wh-registered { background: rgba(39,166,68,0.10); color: #4fd977; border-color: rgba(39,166,68,0.3); }
.badge-wh-mismatch { background: rgba(234,179,8,0.10); color: #f4cc4b; border-color: rgba(234,179,8,0.35); }
.badge-wh-unknown { background: rgba(255,255,255,0.03); color: var(--meta); border-color: var(--border); }
.badge-wh-error { background: rgba(220,38,38,0.12); color: #ff8a8a; border-color: rgba(220,38,38,0.35); }
.badge-job-pending { background: rgba(255,255,255,0.03); color: var(--meta); border-color: var(--border); }
.badge-job-running { background: rgba(94,106,210,0.14); color: #a7b0ff; border-color: rgba(94,106,210,0.35); }
.badge-job-running .dot { animation: pulse 1.1s ease-in-out infinite; }
.badge-job-done { background: rgba(39,166,68,0.10); color: #4fd977; border-color: rgba(39,166,68,0.3); }
.badge-job-failed { background: rgba(220,38,38,0.12); color: #ff8a8a; border-color: rgba(220,38,38,0.35); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes spin { to { transform: rotate(360deg); } }
.spinning { animation: spin 0.8s linear infinite; }

/* ── Tenants table ────────────────────────────────────────────────── */
.tt-grid { --cols: 30px minmax(150px,1.2fr) minmax(160px,1.5fr) 92px 96px 168px 108px 30px; }
.table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-top: var(--space-5); }
.tt-head, .tt-row { display: grid; grid-template-columns: var(--cols); align-items: center; }
.tt-head { padding: 10px var(--space-4); border-bottom: 1px solid var(--border-soft); background: rgba(255,255,255,0.015); }
.tt-head span { font-size: 11px; font-weight: 590; text-transform: uppercase; letter-spacing: 0.05em; color: var(--meta); }
.tt-row { padding: 11px var(--space-4); border-bottom: 1px solid var(--border-soft); cursor: pointer; transition: background var(--motion-fast) var(--ease-standard); }
.tt-row:hover { background: rgba(255,255,255,0.025); }
.tt-row:last-child { border-bottom: none; }
.tt-row.expanded { background: rgba(94,106,210,0.05); }
.tt-row.flash { animation: flashSuccess 1.6s var(--ease-standard); }
@keyframes flashSuccess { 0% { background: rgba(39,166,68,0.16); } 100% { background: transparent; } }
.tt-cell { font-size: var(--text-sm); color: var(--fg-2); padding-right: var(--space-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tt-cell.slug { font-family: var(--font-mono); color: var(--fg); font-size: 13px; font-weight: 500; }
.tt-cell.expertise { color: var(--muted); }
.tt-cell.created { font-family: var(--font-mono); font-size: 12px; color: var(--meta); }
.tt-chevron { display: flex; color: var(--meta); transition: transform var(--motion-fast) var(--ease-standard); }
.tt-row.expanded .tt-chevron { transform: rotate(90deg); color: var(--accent-hover); }
.wh-cell { display: flex; align-items: center; gap: 6px; }
.recheck-btn { background: transparent; border: none; color: var(--meta); padding: 3px; border-radius: 4px; display: flex; }
.recheck-btn:hover { color: var(--fg-2); background: rgba(255,255,255,0.06); }

/* ── Expand panel (inspector) ─────────────────────────────────────── */
.expand-wrap { grid-column: 1 / -1; background: #101112; border-top: 1px solid var(--border-soft); border-bottom: 1px solid var(--border-soft); padding: var(--space-6); animation: expandIn var(--motion-base) var(--ease-standard); }
@keyframes expandIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.panel-section { padding-bottom: var(--space-5); margin-bottom: var(--space-5); border-bottom: 1px solid var(--border-soft); }
.panel-section:last-of-type { border-bottom: none; }
.panel-section-title { font-size: var(--text-xs); font-weight: 590; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg-2); margin-bottom: var(--space-4); display: flex; align-items: center; gap: 8px; }
.panel-section-title .hint { text-transform: none; font-weight: 400; letter-spacing: 0; color: var(--meta); font-size: 11px; }
.field-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--space-4); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 11px; font-weight: 590; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.field input, .field select, .field textarea {
  background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 8px 10px; color: var(--fg); width: 100%;
}
.field input::placeholder, .field textarea::placeholder { color: var(--meta); }
.field textarea { resize: vertical; min-height: 60px; font-family: var(--font-body); line-height: 1.5; }
.field-pw-wrap { position: relative; }
.field-pw-wrap input { padding-right: 34px; font-family: var(--font-mono); font-size: 13px; }
.reveal-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--meta); padding: 4px; display: flex; }
.reveal-btn:hover { color: var(--fg-2); }
.toggle-row { display: flex; align-items: center; gap: 10px; }
.toggle { position: relative; width: 38px; height: 22px; flex: none; }
.toggle input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.toggle .track { position: absolute; inset: 0; background: rgba(255,255,255,0.1); border-radius: 999px; border: 1px solid var(--border); transition: background var(--motion-fast); }
.toggle .thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--meta); transition: transform var(--motion-fast) var(--ease-standard), background var(--motion-fast); }
.toggle input:checked + .track { background: rgba(39,166,68,0.25); border-color: rgba(39,166,68,0.4); }
.toggle input:checked + .track + .thumb { transform: translateX(16px); background: var(--success); }
.toggle-label { font-size: var(--text-sm); color: var(--fg-2); }

details.collapsible { border: 1px solid var(--border-soft); border-radius: var(--radius-md); margin-bottom: var(--space-5); background: rgba(255,255,255,0.012); }
details.collapsible summary { list-style: none; cursor: pointer; padding: var(--space-3) var(--space-4); display: flex; align-items: center; justify-content: space-between; font-size: var(--text-xs); font-weight: 590; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg-2); }
details.collapsible summary::-webkit-details-marker { display: none; }
details.collapsible summary .sub { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--meta); font-size: 11px; }
details.collapsible summary .chev { transition: transform var(--motion-fast) var(--ease-standard); color: var(--meta); }
details.collapsible[open] summary .chev { transform: rotate(180deg); }
details.collapsible .details-body { padding: 0 var(--space-4) var(--space-4); }

.panel-actions { display: flex; align-items: center; justify-content: flex-end; gap: var(--space-3); padding-top: var(--space-2); }
.panel-actions .inline-error { margin-top: 0; margin-right: auto; }

/* ── Danger zone ──────────────────────────────────────────────────── */
.danger-zone { border: 1px solid rgba(220,38,38,0.3); border-radius: var(--radius-md); background: rgba(220,38,38,0.035); padding: var(--space-4); margin-top: var(--space-6); }
.danger-zone > h4 { font-size: var(--text-xs); font-weight: 590; text-transform: uppercase; letter-spacing: 0.05em; color: #ff9d9d; margin-bottom: var(--space-3); }
.danger-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-3) 0; border-top: 1px solid rgba(220,38,38,0.15); flex-wrap: wrap; }
.danger-row:first-of-type { border-top: none; }
.danger-row .desc strong { color: var(--fg-2); font-size: var(--text-sm); font-weight: 590; display: block; }
.danger-row .desc p { color: var(--meta); font-size: 12px; margin-top: 2px; }
.danger-action { flex: none; }
.confirm-inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.confirm-inline span { font-size: 12px; color: #ffb3b3; }
.confirm-inline input { background: rgba(255,255,255,0.03); border: 1px solid rgba(220,38,38,0.4); border-radius: var(--radius-sm); padding: 6px 9px; color: var(--fg); font-family: var(--font-mono); font-size: 12px; width: 190px; }
.confirm-inline .inline-error { margin-top: 0; width: 100%; }
.key-reveal-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(94,106,210,0.4); border-radius: var(--radius-md); padding: var(--space-3); max-width: 420px; }
.key-warning { display: flex; align-items: center; gap: 6px; color: #f4cc4b; font-size: 11px; font-weight: 590; margin-bottom: 8px; }
.key-value-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.key-value { flex: 1; background: rgba(0,0,0,0.35); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-family: var(--font-mono); font-size: 12px; color: var(--fg); word-break: break-all; }

/* ── Staff list ───────────────────────────────────────────────────── */
.staff-list { display: flex; flex-direction: column; gap: 6px; margin-top: var(--space-2); }
.staff-row { display: flex; align-items: center; gap: var(--space-3); padding: 8px 0; border-top: 1px solid var(--border); }
.staff-row:first-child { border-top: none; }
.staff-row .mono { flex: 1; color: var(--fg-2); }

/* ── Add tenant form ──────────────────────────────────────────────── */
.add-form { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-5); margin-top: var(--space-5); animation: expandIn var(--motion-base) var(--ease-standard); }
.add-form h3 { font-size: var(--text-base); font-weight: 590; color: var(--fg); margin-bottom: var(--space-4); }
.add-form .field-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
.add-form .inline-error { margin-bottom: var(--space-4); }

/* ── Documents view ───────────────────────────────────────────────── */
.docs-layout { display: grid; grid-template-columns: minmax(0,1fr); gap: var(--space-5); }
.docs-toolbar { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); flex-wrap: wrap; }
.select-wrap select {
  background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 8px 30px 8px 10px; color: var(--fg); font-size: var(--text-sm); min-width: 220px;
}
.dropzone {
  border: 1.5px dashed var(--border); border-radius: var(--radius-lg); padding: var(--space-8);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-3);
  text-align: center; background: rgba(255,255,255,0.012); transition: border-color var(--motion-fast), background var(--motion-fast);
}
.dropzone.dragover { border-color: var(--accent); background: rgba(94,106,210,0.06); }
.dropzone .dz-icon { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.04); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--muted); }
.dropzone strong { color: var(--fg); font-size: var(--text-sm); font-weight: 590; }
.dropzone p { color: var(--meta); font-size: 12px; }
.dropzone .chosen-file { font-family: var(--font-mono); font-size: 12px; color: var(--accent-hover); }
.upload-options { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); margin-top: var(--space-4); flex-wrap: wrap; }
.warn-check { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); transition: border-color var(--motion-fast), background var(--motion-fast); cursor: pointer; }
.warn-check input { margin-top: 2px; accent-color: var(--danger); }
.warn-check span { font-size: 12px; color: var(--muted); }
.warn-check.active { border-color: rgba(220,38,38,0.45); background: rgba(220,38,38,0.06); }
.warn-check.active span { color: #ffb3b3; font-weight: 510; }
.progress { height: 8px; border-radius: 999px; background: rgba(255,255,255,0.06); overflow: hidden; position: relative; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.25s var(--ease-standard); }
.progress-fill.striped { background-image: linear-gradient(45deg, rgba(255,255,255,0.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.15) 75%, transparent 75%, transparent); background-size: 22px 22px; animation: stripe 0.9s linear infinite; }
@keyframes stripe { to { background-position: 22px 0; } }
.indexing-status { margin-top: var(--space-4); background: rgba(255,255,255,0.02); border: 1px solid var(--border-soft); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); }
.indexing-status .row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.indexing-status .fname { font-family: var(--font-mono); font-size: 12px; color: var(--fg-2); }
.indexing-status .count { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
.indexing-status .err-text { display: block; margin-top: 8px; }

.data-table { width: 100%; border-collapse: collapse; margin-top: var(--space-5); }
.data-table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.data-table th { text-align: left; font-size: 11px; font-weight: 590; text-transform: uppercase; letter-spacing: 0.05em; color: var(--meta); padding: 10px var(--space-4); border-bottom: 1px solid var(--border-soft); background: rgba(255,255,255,0.015); }
.data-table td { padding: 11px var(--space-4); border-bottom: 1px solid var(--border-soft); font-size: var(--text-sm); color: var(--fg-2); }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: rgba(255,255,255,0.02); }
.file-name { font-family: var(--font-mono); font-size: 13px; color: var(--fg); }
.chunk-count { font-family: var(--font-mono); color: var(--muted); }
.err-text { color: #ff8a8a; font-size: 12px; }
.ts { font-family: var(--font-mono); font-size: 12px; color: var(--meta); }

/* ── Jobs view ────────────────────────────────────────────────────── */
.job-progress-cell { display: flex; align-items: center; gap: 8px; min-width: 140px; }
.job-progress-cell .progress { flex: 1; width: 90px; }
.job-progress-cell .count { font-size: 11px; color: var(--meta); font-family: var(--font-mono); white-space: nowrap; }

/* ── Empty state ──────────────────────────────────────────────────── */
.empty-state { padding: var(--space-8); text-align: center; color: var(--meta); font-size: var(--text-sm); }
.empty-state .btn { margin-top: var(--space-3); }

/* ── Toasts ───────────────────────────────────────────────────────── */
.toast-stack { position: fixed; bottom: var(--space-5); right: var(--space-5); display: flex; flex-direction: column; gap: 8px; z-index: 100; }
.toast { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 14px; font-size: 13px; color: var(--fg-2); box-shadow: var(--elev-raised); display: flex; align-items: center; gap: 8px; max-width: 320px; animation: toastIn var(--motion-base) var(--ease-standard); }
@keyframes toastIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.toast.success { border-color: rgba(39,166,68,0.35); }
.toast.success .toast-dot { background: var(--success); }
.toast.error { border-color: rgba(220,38,38,0.35); }
.toast.error .toast-dot { background: var(--danger); }
.toast-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }

/* ── Responsive ───────────────────────────────────────────────────── */
@media (max-width: 900px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; flex-direction: row; align-items: center; gap: var(--space-4); overflow-x: auto; }
  .sidebar-nav { flex-direction: row; }
  .sidebar-footer { flex-direction: row; margin: 0; border: none; padding: 0; margin-left: auto; }
  .main { padding: var(--space-4); }
  .tt-grid { --cols: 26px minmax(120px,1fr) 0px 0px 88px 0px 0px 26px; }
  .tt-cell.expertise, .tt-cell.created, .tt-head span:nth-child(3), .tt-head span:nth-child(6), .tt-head span:nth-child(7), .wh-cell { display: none; }
  .field-grid, .add-form .field-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="login-screen" class="login-screen" data-od-id="login-screen">
  <div class="login-card">
    <div class="login-mark">
      <svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><line x1="12" y1="7" x2="12" y2="11"></line><line x1="8" y1="16" x2="8" y2="16"></line><line x1="16" y1="16" x2="16" y2="16"></line></svg>
    </div>
    <h1>langraph-bot admin</h1>
    <p class="sub">Enter the operator key to continue.</p>
    <form id="login-form">
      <div class="login-field">
        <label for="login-password">Operator key</label>
        <input type="password" id="login-password" data-od-id="login-password-input" placeholder="••••••••••••" autocomplete="current-password" autofocus>
      </div>
      <div class="login-error" id="login-error"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg><span id="login-error-text">Operator key required.</span></div>
      <button type="submit" class="btn btn-primary login-submit" data-od-id="login-submit-btn" id="login-submit">Unlock</button>
    </form>
  </div>
</div>

<div id="app-shell" class="app-shell hidden">
  <aside class="sidebar" data-od-id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">L</div>
      <div class="brand-text"><strong>langraph-bot</strong><span>admin</span></div>
    </div>
    <nav class="sidebar-nav" data-od-id="sidebar-nav" id="sidebar-nav">
      <button class="nav-item active" data-tab="tenants" data-od-id="nav-tenants">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        Tenants
      </button>
      <button class="nav-item" data-tab="documents" data-od-id="nav-documents">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        Documents
      </button>
      <button class="nav-item" data-tab="jobs" data-od-id="nav-jobs">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
        Jobs
      </button>
    </nav>
    <div class="sidebar-footer">
      <div class="env-tag">production</div>
      <button class="nav-item" data-action="logout" data-od-id="logout-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Log out
      </button>
    </div>
  </aside>
  <main class="main" id="main-view" data-od-id="main-view"></main>
</div>

<div class="toast-stack" id="toast-stack"></div>

<script>
/* ── Icons ────────────────────────────────────────────────────────── */
const ICON = {
  chevronRight: '<polyline points="9 18 15 12 9 6"></polyline>',
  chevronDown: '<polyline points="6 9 12 15 18 9"></polyline>',
  eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>',
  eyeOff: '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>',
  trash: '<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>',
  refresh: '<polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>',
  x: '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
  alert: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line>',
};
function ic(name, cls) { return `<svg class="icon ${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[name]}</svg>`; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
function fmtDate(iso) { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }); }
function fmtTime(iso) { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }); }

/* ── Auth / API layer ─────────────────────────────────────────────── */
const OPERATOR_KEY_STORAGE = 'lgb_admin_operator_key';
function operatorKey() { return localStorage.getItem(OPERATOR_KEY_STORAGE) || ''; }
async function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({ 'X-Operator-Key': operatorKey() }, opts.headers || {});
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  let data = null;
  try { data = await res.json(); } catch { data = null; }
  if (!res.ok) {
    const err = new Error((data && data.detail) || `Request failed (${res.status})`);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}
async function verifyKey(key) {
  const res = await fetch('/admin/tenants', { headers: { 'X-Operator-Key': key } });
  return res.ok;
}

/* ── State ────────────────────────────────────────────────────────── */
const state = {
  activeTab: 'tenants',
  tenants: [],
  tenantsLoading: false,
  tenantsError: '',
  expandedTenant: null,
  addTenantOpen: false,
  addTenantSaving: false,
  addTenantError: '',
  addTenantResult: null,
  revealed: new Set(),
  saveLoading: new Set(),
  saveError: {},
  webhookStatus: {},
  webhookChecking: new Set(),
  regenState: {},
  regenKey: {},
  regenError: {},
  deleteState: {},
  deleteError: {},
  flashSlug: null,
  staff: {},
  staffLoading: {},
  staffError: {},
  staffAdding: {},
  staffAddError: {},

  docsTenant: '',
  docsFile: null,
  docsReplaceAll: false,
  docsUploading: false,
  docsProgress: { done: 0, total: 0, filename: '', status: '' },
  docsUploadError: '',
  chunkFiles: [],
  chunkFilesLoading: false,
  chunkFilesError: '',
  deletingFile: null,

  jobs: [],
  jobsLoading: false,
  jobsFilter: 'all',
};

/* ── Toasts ───────────────────────────────────────────────────────── */
function toast(msg, type) {
  const stack = document.getElementById('toast-stack');
  const el = document.createElement('div');
  el.className = `toast ${type||''}`;
  el.innerHTML = `<span class="toast-dot"></span><span>${esc(msg)}</span>`;
  stack.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 200ms'; setTimeout(() => el.remove(), 200); }, 3200);
}

/* ── Login ────────────────────────────────────────────────────────── */
function showApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-shell').classList.remove('hidden');
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('login-password');
  const errBox = document.getElementById('login-error');
  const btn = document.getElementById('login-submit');
  const val = input.value.trim();
  if (!val) {
    document.getElementById('login-error-text').textContent = 'Operator key required.';
    errBox.classList.add('show');
    input.focus();
    return;
  }
  errBox.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Verifying…';
  try {
    const ok = await verifyKey(val);
    if (!ok) throw new Error('bad key');
    localStorage.setItem(OPERATOR_KEY_STORAGE, val);
    input.value = '';
    showApp();
    await bootstrap();
  } catch {
    document.getElementById('login-error-text').textContent = 'Invalid operator key. Try again.';
    errBox.classList.add('show');
    input.focus();
  } finally {
    btn.disabled = false;
    btn.textContent = 'Unlock';
  }
});

/* ── Nav ──────────────────────────────────────────────────────────── */
document.getElementById('sidebar-nav').addEventListener('click', (e) => {
  const btn = e.target.closest('.nav-item');
  if (!btn) return;
  state.activeTab = btn.dataset.tab;
  state.expandedTenant = null;
  state.addTenantOpen = false;
  render();
  if (state.activeTab === 'documents') {
    if (!state.docsTenant && state.tenants.length) state.docsTenant = state.tenants[0].slug;
    if (state.docsTenant) fetchChunkFiles();
  } else if (state.activeTab === 'jobs') {
    fetchJobs();
  }
});
document.querySelector('.sidebar-footer').addEventListener('click', (e) => {
  if (e.target.closest('[data-action="logout"]')) {
    localStorage.removeItem(OPERATOR_KEY_STORAGE);
    location.reload();
  }
});

/* ── Render root ──────────────────────────────────────────────────── */
function render() {
  document.querySelectorAll('.nav-item[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === state.activeTab));
  const main = document.getElementById('main-view');
  if (state.activeTab === 'tenants') main.innerHTML = renderTenantsView();
  else if (state.activeTab === 'documents') main.innerHTML = renderDocumentsView();
  else main.innerHTML = renderJobsView();
  bindViewEvents();
  if (state.flashSlug) {
    const row = main.querySelector(`.tt-row[data-slug="${CSS.escape(state.flashSlug)}"]`);
    if (row) row.classList.add('flash');
    state.flashSlug = null;
  }
}

/* ── Bootstrap ────────────────────────────────────────────────────── */
async function bootstrap() {
  await fetchTenants();
  if (!state.docsTenant && state.tenants.length) state.docsTenant = state.tenants[0].slug;
  render();
}

async function fetchTenants() {
  state.tenantsLoading = true;
  state.tenantsError = '';
  render();
  try {
    state.tenants = await api('/admin/tenants');
  } catch (err) {
    state.tenantsError = err.message;
  }
  state.tenantsLoading = false;
  render();
}

/* ── Tenants view ─────────────────────────────────────────────────── */
function planBadge(plan) { return `<span class="badge badge-plan-${plan}">${esc(plan)}</span>`; }
function statusBadge(active) { return `<span class="badge badge-status-${active?'active':'inactive'}"><span class="dot" style="background:${active?'#4fd977':'#62666d'}"></span>${active?'active':'inactive'}</span>`; }
function webhookBadge(wh) {
  const labels = { registered:'registered', mismatch:'mismatch', unknown:'unknown', error:'error' };
  const dotColor = { registered:'#4fd977', mismatch:'#f4cc4b', unknown:'#62666d', error:'#ff8a8a' };
  const key = labels[wh] ? wh : 'unknown';
  return `<span class="badge badge-wh-${key}"><span class="dot" style="background:${dotColor[key]}"></span>${labels[key]}</span>`;
}

function renderTenantsView() {
  const activeCount = state.tenants.filter(t => t.active).length;
  return `
  <div class="view-header">
    <div><h2 data-od-id="tenants-heading">Tenants</h2><p>${state.tenants.length} tenants · ${activeCount} active</p></div>
    <div class="toolbar">
      <button class="btn btn-primary" data-action="toggle-add-tenant" data-od-id="add-tenant-btn">${ic('plus')} Add tenant</button>
    </div>
  </div>
  ${state.addTenantOpen ? renderAddTenantForm() : ''}
  <div class="table-card tt-grid" data-od-id="tenants-table">
    <div class="tt-head">
      <span></span><span>Slug</span><span>Expertise</span><span>Plan</span><span>Status</span><span>Webhook</span><span>Created</span><span></span>
    </div>
    ${state.tenantsLoading ? `<div class="empty-state">Loading tenants…</div>` : ''}
    ${!state.tenantsLoading && state.tenantsError ? `<div class="empty-state">${esc(state.tenantsError)}<br><button class="btn btn-ghost btn-sm" data-action="retry-tenants">Retry</button></div>` : ''}
    ${!state.tenantsLoading && !state.tenantsError && state.tenants.length === 0 ? `<div class="empty-state">No tenants yet.<br><button class="btn btn-primary btn-sm" data-action="toggle-add-tenant">Create the first one</button></div>` : ''}
    ${!state.tenantsLoading && !state.tenantsError ? state.tenants.map(t => renderTenantRow(t)).join('') : ''}
  </div>`;
}

function renderTenantRow(t) {
  const expanded = state.expandedTenant === t.slug;
  const checking = state.webhookChecking.has(t.slug);
  const wh = state.webhookStatus[t.slug] || 'unknown';
  return `
  <div class="tt-row ${expanded?'expanded':''}" data-slug="${esc(t.slug)}" data-action="toggle-expand" data-od-id="tenant-row-${esc(t.slug)}">
    <span class="tt-chevron">${ic('chevronRight')}</span>
    <span class="tt-cell slug">${esc(t.slug)}</span>
    <span class="tt-cell expertise">${esc(t.expertise_area || '—')}</span>
    <span class="tt-cell">${planBadge(t.plan)}</span>
    <span class="tt-cell">${statusBadge(t.active)}</span>
    <span class="tt-cell wh-cell">${webhookBadge(wh)}<button class="recheck-btn" data-action="recheck-webhook" data-slug="${esc(t.slug)}" data-od-id="webhook-recheck-${esc(t.slug)}" title="Recheck webhook">${ic('refresh', checking?'spinning':'')}</button></span>
    <span class="tt-cell created">${fmtDate(t.created_at)}</span>
    <span></span>
  </div>
  ${expanded ? `<div class="expand-wrap" data-od-id="expand-panel-${esc(t.slug)}">${renderExpandPanel(t)}</div>` : ''}`;
}

function pwField(label, key, tenant, placeholder) {
  const revealKey = `${tenant.slug}:${key}`;
  const revealed = state.revealed.has(revealKey);
  return `
  <div class="field">
    <label>${label}</label>
    <div class="field-pw-wrap">
      <input type="${revealed?'text':'password'}" data-field="${key}" placeholder="${placeholder}" autocomplete="off">
      <button type="button" class="reveal-btn" data-action="toggle-reveal" data-key="${revealKey}">${ic(revealed?'eyeOff':'eye')}</button>
    </div>
  </div>`;
}

function renderExpandPanel(t) {
  const regenState = state.regenState[t.slug] || 'idle';
  const deleteState = state.deleteState[t.slug] || 'idle';
  const saving = state.saveLoading.has(t.slug);
  const saveErr = state.saveError[t.slug];
  const regenErr = state.regenError[t.slug];
  const deleteErr = state.deleteError[t.slug];
  return `
  <div class="panel-section">
    <div class="panel-section-title">Telegram credentials <span class="hint">leave blank to keep current</span></div>
    <div class="field-grid">
      ${pwField('Bot token', 'bot_token', t, '••••••••••••••••')}
      ${pwField('Webhook secret', 'webhook_secret', t, '••••••••••••••••')}
    </div>
  </div>
  <div class="panel-section">
    <div class="panel-section-title">Configuration</div>
    <div class="field-grid">
      <div class="field"><label>Plan</label>
        <select data-field="plan">
          ${['free','basic','pro'].map(p=>`<option value="${p}" ${t.plan===p?'selected':''}>${p}</option>`).join('')}
        </select>

/* ── Event binding (delegated per-view) ──────────────────────────── */
function bindViewEvents() {
  const main = document.getElementById('main-view');

  main.addEventListener('click', onMainClick);
  main.addEventListener('input', onMainInput);
  main.addEventListener('change', onMainChange);

  const dz = document.getElementById('dropzone');
  if (dz) {
    dz.addEventListener('click', () => document.getElementById('file-input').click());
    dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
    dz.addEventListener('drop', (e) => {
      e.preventDefault(); dz.classList.remove('dragover');
      if (e.dataTransfer.files.length) { state.docsFile = e.dataTransfer.files[0]; render(); }
    });
    document.getElementById('file-input').addEventListener('change', (e) => {
      if (e.target.files.length) { state.docsFile = e.target.files[0]; render(); }
    });
  }

  const refreshBtn = document.getElementById('jobs-refresh-btn');
  if (refreshBtn) refreshBtn.addEventListener('click', fetchJobs);
}

function onMainClick(e) {
  const row = e.target.closest('[data-action="toggle-expand"]');
  const actionEl = e.target.closest('[data-action]');
  if (!actionEl) return;
  const action = actionEl.dataset.action;
  const slug = actionEl.dataset.slug;

  switch (action) {
    case 'toggle-add-tenant':
      state.addTenantOpen = !state.addTenantOpen;
      state.addTenantError = '';
      state.addTenantResult = null;
      render();
      break;
    case 'toggle-expand': {
      const rowSlug = row.dataset.slug;
      const opening = state.expandedTenant !== rowSlug;
      state.expandedTenant = opening ? rowSlug : null;
      render();
      if (opening && !state.staff[rowSlug]) fetchStaff(rowSlug);
      break;
    }
    case 'collapse':
      state.expandedTenant = null;
      render();
      break;
    case 'toggle-reveal': {
      e.stopPropagation();
      const key = actionEl.dataset.key;
      state.revealed.has(key) ? state.revealed.delete(key) : state.revealed.add(key);
      render();
      break;
    }
    case 'recheck-webhook': {
      e.stopPropagation();
      recheckWebhook(slug);
      break;
    }
    case 'retry-tenants':
      fetchTenants();
      break;
    case 'save-tenant':
      saveTenant(slug);
      break;
    case 'create-tenant':
      createTenant();
      break;
    case 'add-tenant-done':
      state.addTenantOpen = false;
      state.addTenantResult = null;
      render();
      break;
    case 'regen-start':
      state.regenState[slug] = 'confirm';
      render();
      break;
    case 'regen-cancel':
      state.regenState[slug] = 'idle';
      delete state.regenError[slug];
      render();
      break;
    case 'regen-confirm':
      regenerateKey(slug);
      break;
    case 'regen-done':
      state.regenState[slug] = 'idle';
      delete state.regenKey[slug];
      render();
      break;
    case 'copy-key': {
      const key = actionEl.dataset.key;
      if (key && navigator.clipboard) navigator.clipboard.writeText(key);
      toast('Copied to clipboard.', 'success');
      break;
    }
    case 'delete-start':
      state.deleteState[slug] = 'confirm';
      delete state.deleteError[slug];
      render();
      break;
    case 'delete-cancel':
      state.deleteState[slug] = 'idle';
      delete state.deleteError[slug];
      render();
      break;
    case 'delete-confirm':
      deleteTenant(slug);
      break;
    case 'delete-file':
      deleteFile(actionEl.dataset.name);
      break;
    case 'add-staff':
      addStaffMember(slug);
      break;
    case 'remove-staff':
      removeStaffMember(slug, Number(actionEl.dataset.staffId));
      break;
  }
}

function onMainInput(e) {
  if (e.target.dataset.actionInput === 'delete-confirm-input') {
    const slug = e.target.dataset.slug;
    const btn = e.target.closest('.confirm-inline').querySelector('[data-action="delete-confirm"]');
    btn.disabled = e.target.value !== slug;
  }
}

function onMainChange(e) {
  if (e.target.id === 'docs-tenant-select') {
    state.docsTenant = e.target.value;
    state.docsFile = null;
    state.docsReplaceAll = false;
    state.chunkFiles = [];
    render();
    fetchChunkFiles();
  } else if (e.target.id === 'jobs-filter-select') {
    state.jobsFilter = e.target.value;
    fetchJobs();
  } else if (e.target.id === 'replace-all-checkbox') {
    state.docsReplaceAll = e.target.checked;
    document.getElementById('replace-all-label').classList.toggle('active', state.docsReplaceAll);
  }
}

document.getElementById('main-view')?.addEventListener('click', (e) => {
  if (e.target.closest('#upload-btn')) startUpload();
});

/* ── Tenant actions ───────────────────────────────────────────────── */
async function recheckWebhook(slug) {
  state.webhookChecking.add(slug);
  render();
  try {
    const data = await api(`/admin/tenants/${encodeURIComponent(slug)}/webhook-status`);
    state.webhookStatus[slug] = data.status;
    toast(`Webhook recheck for ${slug}: ${data.status}`, data.status === 'registered' ? 'success' : data.status === 'error' ? 'error' : undefined);
  } catch (err) {
    state.webhookStatus[slug] = 'error';
    toast(`Webhook recheck failed: ${err.message}`, 'error');
  }
  state.webhookChecking.delete(slug);
  render();
}

async function saveTenant(slug) {
  const panel = document.querySelector(`[data-od-id="expand-panel-${CSS.escape(slug)}"]`);
  const get = (field) => panel.querySelector(`[data-field="${field}"]`);
  const payload = {
    plan: get('plan').value,
    expertise_area: get('expertise_area').value.trim(),
    specialization_context: get('specialization_context').value.trim(),
    contact_url: get('contact_url').value.trim(),
    tone_description: get('tone_description').value.trim(),
    active: get('active').checked,
  };
  const botToken = get('bot_token').value.trim();
  const webhookSecret = get('webhook_secret').value.trim();
  const waPhone = get('wa_phone_number_id').value.trim();
  const waAccess = get('wa_access_token').value.trim();
  const waSecret = get('wa_app_secret').value.trim();
  const waVerify = get('wa_verify_token').value.trim();
  if (botToken) payload.bot_token = botToken;
  if (webhookSecret) payload.webhook_secret = webhookSecret;
  if (waPhone) payload.wa_phone_number_id = waPhone;
  if (waAccess) payload.wa_access_token = waAccess;
  if (waSecret) payload.wa_app_secret = waSecret;
  if (waVerify) payload.wa_verify_token = waVerify;

  state.saveLoading.add(slug);
  delete state.saveError[slug];
  render();
  try {
    const data = await api(`/admin/tenants/${encodeURIComponent(slug)}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const t = state.tenants.find(x => x.slug === slug);
    Object.assign(t, {
      plan: data.plan, expertise_area: data.expertise_area, specialization_context: data.specialization_context,
      contact_url: data.contact_url, tone_description: data.tone_description, active: data.active,
    });
    state.saveLoading.delete(slug);
    state.expandedTenant = null;
    state.flashSlug = slug;
    render();
    toast(`Saved changes for ${slug}.`, 'success');
    if (data.webhook_registered === false) {
      toast('Webhook registration failed — check the Telegram bot token and try again.', 'error');
    }
  } catch (err) {
    state.saveLoading.delete(slug);
    state.saveError[slug] = err.message;
    render();
  }
}

async function createTenant() {
  const slug = document.getElementById('new-slug').value.trim();
  const botToken = document.getElementById('new-bot-token').value.trim();
  const webhookSecret = document.getElementById('new-webhook-secret').value.trim();
  const plan = document.getElementById('new-plan').value;
  const expertise = document.getElementById('new-expertise').value.trim();
  const specialization = document.getElementById('new-specialization-context').value.trim();
  const contact = document.getElementById('new-contact').value.trim();
  if (!slug || !botToken || !webhookSecret) {
    state.addTenantError = 'Slug, bot token, and webhook secret are required.';
    render();
    return;
  }
  state.addTenantSaving = true;
  state.addTenantError = '';
  render();
  try {
    const data = await api('/admin/tenants', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        slug, bot_token: botToken, webhook_secret: webhookSecret, plan,
        expertise_area: expertise, specialization_context: specialization, contact_url: contact,
      }),
    });
    state.addTenantResult = { slug: data.slug, api_key: data.api_key };
    await fetchTenants();
  } catch (err) {
    state.addTenantError = err.message;
  }
  state.addTenantSaving = false;
  render();
}

async function regenerateKey(slug) {
  state.regenState[slug] = 'loading';
  render();
  try {
    const data = await api(`/admin/tenants/${encodeURIComponent(slug)}/regen-key`, { method: 'POST' });
    state.regenKey[slug] = data.api_key;
    state.regenState[slug] = 'revealed';
    toast(`API key regenerated for ${slug}.`, 'success');
  } catch (err) {
    state.regenError[slug] = err.message;
    state.regenState[slug] = 'error';
  }
  render();
}

async function deleteTenant(slug) {
  state.deleteState[slug] = 'loading';
  delete state.deleteError[slug];
  render();
  try {
    await api(`/admin/tenants/${encodeURIComponent(slug)}`, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ confirm_slug: slug }),
    });
    state.tenants = state.tenants.filter(t => t.slug !== slug);
    delete state.webhookStatus[slug];
    delete state.regenState[slug];
    delete state.deleteState[slug];
    delete state.staff[slug];
    state.expandedTenant = null;
    render();
    toast(`Tenant "${slug}" deleted.`, 'success');
  } catch (err) {
    state.deleteError[slug] = err.message;
    state.deleteState[slug] = 'confirm';
    render();
  }
}

/* ── Staff actions ────────────────────────────────────────────────── */
async function fetchStaff(slug) {
  state.staffLoading[slug] = true;
  state.staffError[slug] = '';
  render();
  try {
    state.staff[slug] = await api(`/admin/tenants/${encodeURIComponent(slug)}/staff`);
  } catch (err) {
    state.staffError[slug] = err.message;
    state.staff[slug] = [];
  }
  state.staffLoading[slug] = false;
  render();
}

async function addStaffMember(slug) {
  const panel = document.querySelector(`[data-od-id="staff-section-${CSS.escape(slug)}"]`);
  const channel = panel.querySelector('[data-field="staff-channel"]').value;
  const identifierEl = panel.querySelector('[data-field="staff-identifier"]');
  const identifier = identifierEl.value.trim();
  if (!identifier) {
    state.staffAddError[slug] = 'Identifier is required.';
    render();
    return;
  }
  state.staffAdding[slug] = true;
  state.staffAddError[slug] = '';
  render();
  try {
    await api(`/admin/tenants/${encodeURIComponent(slug)}/staff`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ channel, identifier }),
    });
    await fetchStaff(slug);
    toast(`Added ${identifier} as staff on ${channel}.`, 'success');
  } catch (err) {
    state.staffAddError[slug] = err.message;
  }
  state.staffAdding[slug] = false;
  render();
}

async function removeStaffMember(slug, staffId) {
  try {
    await api(`/admin/tenants/${encodeURIComponent(slug)}/staff/${staffId}`, { method: 'DELETE' });
    state.staff[slug] = (state.staff[slug] || []).filter(s => s.id !== staffId);
    render();
    toast('Staff member removed.', 'success');
  } catch (err) {
    toast(`Remove failed: ${err.message}`, 'error');
  }
}

/* ── Documents actions ────────────────────────────────────────────── */
async function fetchChunkFiles() {
  if (!state.docsTenant) return;
  state.chunkFilesLoading = true;
  state.chunkFilesError = '';
  render();
  try {
    state.chunkFiles = await api(`/admin/tenants/${encodeURIComponent(state.docsTenant)}/chunks/files`);
  } catch (err) {
    state.chunkFilesError = err.message;
    state.chunkFiles = [];
  }
  state.chunkFilesLoading = false;
  render();
}

async function deleteFile(filename) {
  state.deletingFile = filename;
  render();
  try {
    const data = await api(`/admin/tenants/${encodeURIComponent(state.docsTenant)}/chunks?source=${encodeURIComponent(filename)}`, { method: 'DELETE' });
    state.chunkFiles = state.chunkFiles.filter(f => f.filename !== filename);
    toast(`Deleted ${data.deleted} chunks from "${filename}".`, 'success');
  } catch (err) {
    toast(`Delete failed: ${err.message}`, 'error');
  }
  state.deletingFile = null;
  render();
}

async function startUpload() {
  if (!state.docsFile || !state.docsTenant || state.docsUploading) return;
  const file = state.docsFile;
  const fd = new FormData();
  fd.append('tenant_slug', state.docsTenant);
  fd.append('file', file);
  fd.append('replace_all', state.docsReplaceAll ? 'true' : 'false');

  state.docsUploading = true;
  state.docsUploadError = '';
  state.docsProgress = { done: 0, total: 0, filename: file.name, status: 'PENDING' };
  render();

  let jobId;
  try {
    const data = await api('/admin/index', { method: 'POST', body: fd });
    jobId = data.job_id;
  } catch (err) {
    state.docsUploading = false;
    state.docsUploadError = err.message;
    render();
    return;
  }
  pollIndexJob(jobId);
}

async function pollIndexJob(jobId) {
  try {
    const job = await api(`/admin/index/${encodeURIComponent(jobId)}`);
    state.docsProgress = { done: job.chunks_done || 0, total: job.chunks_total || 0, filename: job.filename, status: job.status };
    if (job.status === 'DONE') {
      state.docsUploading = false;
      state.docsFile = null;
      state.docsReplaceAll = false;
      render();
      toast(`Indexed ${job.filename} — ${job.chunks_done} chunks.`, 'success');
      fetchChunkFiles();
      return;
    }
    if (job.status === 'FAILED') {
      state.docsUploading = false;
      state.docsUploadError = job.error_message || 'Indexing failed.';
      render();
      toast(`Indexing failed: ${state.docsUploadError}`, 'error');
      return;
    }
    render();
    setTimeout(() => pollIndexJob(jobId), 2000);
  } catch (err) {
    state.docsUploading = false;
    state.docsUploadError = err.message;
    render();
  }
}

/* ── Jobs actions ─────────────────────────────────────────────────── */
async function fetchJobs() {
  state.jobsLoading = true;
  render();
  try {
    const slugs = state.jobsFilter === 'all' ? state.tenants.map(t => t.slug) : [state.jobsFilter];
    const results = await Promise.all(slugs.map(async (slug) => {
      const jobs = await api(`/admin/index?tenant_slug=${encodeURIComponent(slug)}`);
      return jobs.map(j => Object.assign({ tenant: slug }, j));
    }));
    state.jobs = results.flat().sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 100);
  } catch (err) {
    toast(`Failed to load jobs: ${err.message}`, 'error');
    state.jobs = [];
  }
  state.jobsLoading = false;
  render();
}

/* ── Init ─────────────────────────────────────────────────────────── */
(async function init() {
  if (!operatorKey()) return;
  const ok = await verifyKey(operatorKey());
  if (!ok) { localStorage.removeItem(OPERATOR_KEY_STORAGE); return; }
  showApp();
  await bootstrap();
})();
</script>
</body>
</html>
